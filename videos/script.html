<style>body{font-family:Tahoma,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f3f4f8;color:#111}section{background:#fff;border-radius:12px;padding:14px;margin:14px 0}textarea{width:100%;box-sizing:border-box;height:260px;font:inherit;line-height:1.7;border:1px solid #ddd;border-radius:8px;padding:8px}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;margin-bottom:8px}</style></head><body>
<h1>نص فيديوهات الشرح (مصري)</h1><section><h2>فيديو التاجر</h2><button onclick="cp('merchant',this)">انسخ النص كله</button><textarea id="merchant" readonly>أهلاً بيك في موقع تيم موهبتون. في الفيديو ده هنشرحلك إزاي تستخدم الموقع كتاجر، خطوة بخطوة.

أول حاجة، افتح لينك الموقع، واكتب اسم المستخدم والباسورد اللي خدتهم من الإدارة، ودوس دخول.

فوق هتلاقي قسمين: الطلبات، والجرد والمصاريف. وجنبهم جرس الإشعارات، وزرار تغيير الباسورد، وتسجيل الخروج.

لما يجيلك حجز، املا طلب تفعيل جديد. اختار نوع الحدث، واكتب إيميل حساب اللعبة، والباسورد، ويوزر التليجرام، والـ IGG ID. والملاحظة مش إجبارية.

وبعدين دوس أرسل الطلب، وهيوصل للإدارة على طول.

تحت هتلاقي كل طلباتك، وكل طلب ليه حالة. بانتظار التفعيل، يعني لسه محدش مسكه. قيد التفعيل، يعني الإدارة شغالة عليه. تفعّل، يعني خلص. ومرفوض، وهيكون معاه سبب الرفض.

طول ما الطلب بانتظار التفعيل أو مرفوض، تقدر تعدّله. وكل ما حالة الطلب تتغير، هيجيلك إشعار على الجرس.

لو الطلب اتفعّل بس القلعة ما ظهرتش، دوّر على الـ IGG ID، ودوس لسه ما اتفعّلتش، واكتب المشكلة. الإدارة هتشوفها وترد عليك.

في قسم الجرد والمصاريف، سجّل كل حاجة صرفتها. اختار الحدث، واكتب عدد القلاع، وكل مصروف بسعره، ودوس احفظ.

وتحت هيظهرلك كشفك لكل حدث: عدد القلاع، والمصاريف، وسعر القلعة اللي حددته الإدارة، والصافي بيتحسب لوحده. ولما الإدارة تدفعلك، هتلاقي علامة تمت.

بس كده! ولو عندك أي سؤال، كلّم الإدارة. بالتوفيق.</textarea></section><section><h2>فيديو الأدمن</h2><button onclick="cp('admin',this)">انسخ النص كله</button><textarea id="admin" readonly>أهلاً بيك في موقع تيم موهبتون. في الفيديو ده هنشرح لوحة الإدارة بالتفصيل.

فوق عندك أربع أقسام: الطلبات، والتجار، والحسابات، والأحداث. والرقم الأحمر على الطلبات معناه إن فيه طلبات جديدة أو مشاكل مفتوحة.

في قسم الطلبات بتشوف طلبات كل التجار أول بأول. تقدر تدوّر بالـ IGG ID أو الإيميل أو اسم التاجر، وتفلتر حسب الحالة.

كل طلب فيه الإيميل والباسورد والـ IGG ID، وجنب كل واحد زرار نسخ. لما تبدأ تشتغل عليه، دوس قيد التفعيل. ولما يخلص، دوس تفعّل. ولو فيه غلط، دوس رفض واكتب السبب. والتاجر بيجيله إشعار مع كل تغيير.

لو تاجر بلّغ إن القلعة لسه ما اتفعّلتش، الطلب هيظهر في فلتر المشاكل. اقرا الملاحظة، واكتب ردك، ودوس انحلت.

وجرس الإشعارات بيعرضلك كل جديد، طلب جديد أو بلاغ، ومعاه صوت تنبيه.

في قسم التجار بتشوف كل تاجر، وعنده كام قلعة. دوس على أي تاجر، واختار الحدث.

هيظهرلك كشفه كامل. أول حاجة، سعر القلعة للتاجر ده في كل حدث، تكتبه ويتحفظ لوحده. وتحت المصاريف، والمجموع، والصافي محسوب أوتوماتيك.

لما تدفعله، دوس علّم تمت، وتاريخ الدفع هيتحفظ. وتقدر تنسخ الكشف وتبعته على الواتساب.

في قسم الحسابات بتعمل حساب جديد: اسم التاجر، واسم المستخدم، والباسورد، ونوع الحساب، تاجر ولا أدمن، وسعر القلعة لكل حدث. وبعد ما تعمله، انسخ بيانات الدخول وابعتهاله.

وتحت تقدر تعدّل الأسعار، أو تغيّر الباسورد لأي حساب.

وفي قسم الأحداث، بتضيف حدث جديد لما يبدأ، وهيظهر عند كل التجار.

وكده تبقى جاهز. بالتوفيق.</textarea></section>
