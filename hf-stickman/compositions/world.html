  <script>
    (function () {
// rig.js — هيكل الشخصية (عظام بأطوال ثابتة + IK) وأدوات الحركة
// كل شيء يُحسب من الزمن فقط، لا عشوائية بدون بذرة.

const CH = {
  // character-bible: نادر
  nader: {
    headR: 36, torso: 118, upperArm: 62, foreArm: 58, thigh: 74, shin: 72,
    line: 13, ink: '#1F1E24', scarf: '#E8553D',
  },
};

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  io: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  back: u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
  elastic: u => u === 0 || u === 1 ? u : Math.pow(2, -10 * u) * Math.sin((u * 10 - .75) * (2 * Math.PI) / 3) + 1,

const lp = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) });

// بذرة ثابتة
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// IK بعظمتين: من A إلى الهدف T بطولين ثابتين، bend = +1/-1
function ik(A, T, l1, l2, bend) {
  let dx = T.x - A.x, dy = T.y - A.y;
  let d = Math.hypot(dx, dy);
  const max = l1 + l2 - 0.5, min = Math.abs(l1 - l2) + 0.5;
  const dc = clamp(d, min, max);
  const a = Math.atan2(dy, dx);
  const c = clamp((l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc), -1, 1);
  const b = Math.acos(c) * bend;
  const J = { x: A.x + Math.cos(a + b) * l1, y: A.y + Math.sin(a + b) * l1 };
  const E = { x: A.x + Math.cos(a) * dc, y: A.y + Math.sin(a) * dc };
  return { J, E };
}

// حالة افتراضية للوقوف
function basePose(x, feetY, face = 1) {
  return {
    x, y: feetY - 140, face, turn: 0, lean: 0, headTilt: 0, scale: 1, rot: 0,
    hL: { x: -8, y: 112 }, hR: { x: 10, y: 112 },          // نسبة للكتف (محلية: x للأمام)
    fL: { x: -14, y: 140 }, fR: { x: 16, y: 140 },          // نسبة للورك
    look: { x: 0, y: 0 }, blink: 0, mouth: 0, brow: 0, alpha: 1,
    scarfWind: 0,
  };
}

// تنفس ورمش هادئ
function idle(p, t, amt = 1) {
  p.y += Math.sin(t * 2.2) * 2.2 * amt;
  const bt = (t % 3.7);
  if (bt < 0.12) p.blink = Math.max(p.blink, Math.sin(bt / 0.12 * Math.PI));
  return p;
}

// دورة مشي/جري بقدم ثابتة على الأرض: s = المسافة المقطوعة
function gait(p, s, feetY, opts = {}) {
  const L = opts.stride || 110, h = opts.lift || 34, run = opts.run || 0;
  const res = {};
  [['fL', 0], ['fR', 0.5]].forEach(([k, off]) => {
    const u = s / L + off, n = Math.floor(u), f = u - n;
    const Fn = (n - off) * L + L / 4;             // موضع القدم المزروعة (بالنسبة لبداية المشي)
    let fx, fy = 0;
    if (f < 0.5) { fx = Fn; }
    else {
      const w = (f - 0.5) / 0.5, e = ease.io(w);
      fx = lerp(Fn, Fn + L, e);
      fy = -Math.sin(w * Math.PI) * h;
    }
    res[k] = { x: fx - s, y: 140 + fy - (run ? 10 : 0) };
  });
  p.fL = res.fL; p.fR = res.fR;
  const ph = s / L * Math.PI * 2;
  p.y = feetY - 140 + (run ? 14 : 4) - Math.abs(Math.cos(ph)) * (run ? 14 : 7);
  // ذراعان متعاكسان
  const sw = run ? 42 : 26;
  p.hL = { x: Math.sin(ph) * sw * (run ? 1 : 1), y: run ? 80 : 108 };
  p.hR = { x: -Math.sin(ph) * sw, y: run ? 80 : 108 };
  if (run) { p.hL.x += 14; p.hR.x += 14; }
  p.lean = run ? 0.22 : 0.05;
  return p;
}

function drawChar(g, p, def = CH.nader, t = 0) {
  const d = def, f = p.face, tr = p.turn;
  g.save();
  g.globalAlpha = p.alpha;
  g.translate(p.x, p.y);
  g.rotate(p.rot || 0);
  g.scale(p.scale, p.scale);
  // كل الحساب محلي حول الورك (0,0)
  const hip = { x: 0, y: 0 };
  const sinL = Math.sin(p.lean) * f, cosL = Math.cos(p.lean);
  const neck = { x: sinL * d.torso, y: -cosL * d.torso };
  const ang = p.lean * f + p.headTilt * f;
  const head = { x: neck.x + Math.sin(ang) * (d.headR + 4), y: neck.y - Math.cos(ang) * (d.headR + 4) + (p.headDrop || 0) };
  const sh = { x: neck.x * 0.92, y: neck.y * 0.92 + 4 };
  const shOff = 22 * tr, hipOff = 14 * tr;
  const toW = (base, rel) => ({ x: base.x + rel.x * f, y: base.y + rel.y });

    { a: hpR, t: footR, l1: d.thigh, l2: d.shin, bend: legBend ?? -1 },
    { a: shR, t: handR, l1: d.upperArm, l2: d.foreArm, bend: armBend ?? -1 },

  };

  const wv = Math.sin(t * 7) * 0.5 + Math.sin(t * 11.3) * 0.3;
  g.save();
  g.strokeStyle = d.scarf; g.lineWidth = 11;
  const sx = neck.x, sy = neck.y + 6;
  const tail = -f * (1 - tr);
  g.beginPath(); g.moveTo(sx, sy);
  g.quadraticCurveTo(sx + tail * (30 + p.scarfWind * 20), sy + 8 + wv * 6 - p.scarfWind * 10,
    sx + tail * (52 + p.scarfWind * 34) + tr * 10, sy + 26 + wv * 10 - p.scarfWind * 18 + tr * 34);
  g.stroke();
  g.restore();
  limbs.forEach(drawLimb);
  // الجذع
  g.beginPath(); g.moveTo(hip.x, hip.y); g.lineTo(neck.x, neck.y); g.stroke();
  if (p.prop) { g.save(); p.prop(g, front[1].end, limbs[1].end); g.restore(); g.strokeStyle = d.ink; g.lineWidth = d.line; }
  front.forEach(drawLimb);
  // طوق الوشاح
  g.save(); g.strokeStyle = d.scarf; g.lineWidth = 12;
  g.beginPath(); g.moveTo(neck.x - 14, neck.y + 4); g.lineTo(neck.x + 14, neck.y + 4); g.stroke(); g.restore();
  // الرأس
  g.fillStyle = '#FFFDF8';
  g.beginPath(); g.arc(head.x, head.y, d.headR, 0, Math.PI * 2); g.fill(); g.stroke();
  if (p.back) { g.restore(); return { hand: front[1].end, handBack: limbs[1].end, head }; }
  // العينان
  g.fillStyle = d.ink;
  const eyeOpen = 1 - clamp(p.blink);
  const ex = head.x + (f * 12) * (1 - tr) + p.look.x, ey = head.y - 4 + p.look.y;
  const eyes = tr > 0.3 ? [ex - 13 * tr, ex + 13 * tr] : [ex + f * 4];
  eyes.forEach(x => {
    g.beginPath(); g.ellipse(x, ey, 5.5, Math.max(0.8, 7 * eyeOpen), 0, 0, Math.PI * 2); g.fill();
  });
  // الحاجب
  if (p.brow) {
    g.lineWidth = 5;
    eyes.forEach((x, i) => {
      const s = eyes.length > 1 ? (i ? 1 : -1) : f;
      g.beginPath(); g.moveTo(x - 8, ey - 14 - p.brow * 4 * s); g.lineTo(x + 8, ey - 14 + p.brow * 4 * s); g.stroke();
    });
  }
  // الفم
  g.lineWidth = 5;
  const mx = head.x + (f * 10) * (1 - tr) + p.look.x * 0.6, my = head.y + 14;
  g.beginPath();
  if (p.mouth === 'o') { g.ellipse(mx, my + 2, 6, 8, 0, 0, Math.PI * 2); g.stroke(); }
  else {
    const m = p.mouth || 0;
    g.moveTo(mx - 10, my); g.quadraticCurveTo(mx, my + m * 10, mx + 10, my); g.stroke();
  }
  g.restore();
  return { hand: front[1].end, handBack: limbs[1].end, head, neck, toWorld: (q) => ({ x: p.x + q.x * p.scale, y: p.y + q.y * p.scale }) };
}


// ===== عالم «السلّم»: كل إطار دالة في الزمن فقط =====
const W = 1080, H = 1920, RS = 62, LX = 540, LW = 170, S = 1.25, GROUND = 40;

const CK = [[0, -1413, .22], [2.5, -1430, .232, 'lin'], [3.5, -430, 1, 'io3'], [8.0, -450, 1.08, 'lin'], [8.45, -405, 1.06, 'io'],
[9.6, -1694, 1, 'io3'], [11.4, -1728, 1, 'lin'], [12.3, -2996, 1, 'io3'], [14.3, -3030, 1, 'lin'], [15.2, -4308, 1, 'io3'], [15.7, -4318, 1, 'lin'], [17.0, -4572, .72, 'io'], [18.4, -4590, .72, 'lin'],
[19.9, -150, 1, 'io3'], [23.2, -170, 1.04, 'lin'], [24.4, -430, 1, 'io'], [27.6, -450, 1.08, 'lin'], [28.5, -500, 1.14, 'io'], [31.5, -510, 1.14, 'lin'], [33.2, -1413, .22, 'io3'], [36.6, -1430, .232, 'lin']];

const rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

// لون السماء حسب الارتفاع
const SKY = [[200, '#FFE9CC'], [-700, '#CFEBF7'], [-2200, '#9AD2F2'], [-3900, '#5FAEE8'], [-5600, '#3B82D6']];
function skyAt(y) { let k = 0; while (k < SKY.length - 2 && y < SKY[k + 1][0]) k++; const a = SKY[k], b = SKY[k + 1]; return mixc(a[1], b[1], (y - a[0]) / (b[0] - a[0])); }

function background(t) {
  st();
  const yt = CAM.y - 960 / CAM.z, yb = CAM.y + 960 / CAM.z, gr = g.createLinearGradient(0, 0, 0, H);
  for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, skyAt(lerp(yt, yb, i / 6)));

  const sunY = 420 - CAM.y * 0.035, glow = g.createRadialGradient(860, sunY, 30, 860, sunY, 380);
  glow.addColorStop(0, 'rgba(255,236,170,0.9)'); glow.addColorStop(1, 'rgba(255,236,170,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(860, sunY, 380, 0, 7); g.fill();
  g.fillStyle = '#FFE38A'; g.beginPath(); g.arc(860, sunY, 92, 0, 7); g.fill();
  // سحب بعيدة ومتوسطة
  clouds(t, 0.35, 0.75, 21, 0.7, 22); clouds(t, 0.62, 1.0, 22, 0.85, 16);
  // منطاد وطيور
  const by = (-2350 - CAM.y) * 0.6 * CAM.z + 960, bx = 170 + Math.sin(t * 0.4) * 20;
  if (by > -300 && by < H + 300) balloon(bx, by, 1.1 * Math.min(1, CAM.z + 0.3));
  for (let k = 0; k < 5; k++) { const yy = (-1250 - k * 60 - CAM.y) * 0.8 * CAM.z + 960, xx = ((t * 60 + k * 170) % 1400) - 160; if (yy > -50 && yy < H + 50) bird(xx, yy + Math.sin(t * 3 + k) * 10, t + k); }
}
function clouds(t, par, sc, seed, alpha, n) {
  const r = rng(seed); g.fillStyle = `rgba(255,255,255,${alpha})`;
  for (let k = 0; k < n; k++) {
    const wy = -520 - r() * 5600, x0 = r() * 1500 - 200, s = (0.7 + r() * 0.9) * sc * Math.min(1.15, 0.45 + CAM.z * 0.6), sp = 6 + r() * 10;
    const y = (wy - CAM.y) * par * CAM.z + 960; if (y < -160 || y > H + 160) continue;
    const x = ((x0 + t * sp) % 1500 + 1500) % 1500 - 210;
    g.beginPath(); g.ellipse(x, y, 120 * s, 40 * s, 0, 0, 7); g.ellipse(x + 70 * s, y - 28 * s, 76 * s, 46 * s, 0, 0, 7); g.ellipse(x - 64 * s, y - 14 * s, 62 * s, 36 * s, 0, 0, 7); g.fill();

function balloon(x, y, s) {

  g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.moveTo(-34, 70); g.lineTo(-16, 132); g.moveTo(34, 70); g.lineTo(16, 132); g.stroke();
  g.fillStyle = '#F6C445'; g.beginPath(); g.ellipse(0, 0, 80, 92, 0, 0, 7); g.fill();
  g.fillStyle = '#EF7F45'; g.beginPath(); g.ellipse(0, 0, 40, 92, 0, 0, 7); g.fill();
  g.fillStyle = '#F6C445'; g.beginPath(); g.ellipse(0, 0, 12, 92, 0, 0, 7); g.fill();
  g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.ellipse(0, 0, 80, 92, 0, 0, 7); g.stroke();

}
function bird(x, y, t) { const f = Math.sin(t * 9) * 9; g.strokeStyle = INK; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - 18, y - f); g.quadraticCurveTo(x - 8, y - 12, x, y); g.quadraticCurveTo(x + 8, y - 12, x + 18, y - f); g.stroke(); }

function ground(t) {

  for (let x = -3000; x <= 4000; x += 60) g.lineTo(x, GROUND - 190 - 130 * Math.sin(x * 0.0021 + 1) - 60 * Math.sin(x * 0.0063)); g.lineTo(4000, 4000); g.lineTo(-3000, 4000); g.fill();
  g.fillStyle = '#9DD28E'; g.beginPath(); g.moveTo(-3000, GROUND + 20);
  for (let x = -3000; x <= 4000; x += 60) g.lineTo(x, GROUND - 60 - 70 * Math.sin(x * 0.0034 + 3)); g.lineTo(4000, 4000); g.lineTo(-3000, 4000); g.fill();
  // بيوت صغيرة
  [[-900, '#F4B183'], [-560, '#F7D08A'], [1500, '#F4B183'], [1900, '#C9E4F5']].forEach(([x, c]) => { const y = GROUND - 78 - 70 * Math.sin(x * 0.0034 + 3); g.fillStyle = c; g.fillRect(x, y, 150, 110); g.fillStyle = '#B5523B'; g.beginPath(); g.moveTo(x - 20, y); g.lineTo(x + 75, y - 80); g.lineTo(x + 170, y); g.fill(); g.fillStyle = '#6B4A3A'; g.fillRect(x + 56, y + 50, 38, 60); });
  const gr = g.createLinearGradient(0, GROUND, 0, GROUND + 900); gr.addColorStop(0, '#8ACB73'); gr.addColorStop(1, '#5FA654');
  g.fillStyle = gr; g.fillRect(-3000, GROUND, 7000, 6000);
  const r = rng(5); g.strokeStyle = '#4F9447'; g.lineWidth = 5; g.lineCap = 'round';
  for (let k = 0; k < 160; k++) { const x = -2200 + r() * 5500, y = GROUND + 30 + r() * 2600, s = 1 + r(); g.beginPath(); g.moveTo(x, y); g.lineTo(x - 8 * s, y - 20 * s); g.moveTo(x, y); g.lineTo(x + 3 * s, y - 26 * s); g.moveTo(x, y); g.lineTo(x + 11 * s, y - 18 * s); g.stroke(); if (k % 4 === 0) { g.fillStyle = k % 8 ? '#FFFFFF' : '#FFE27A'; g.beginPath(); g.arc(x + 36, y - 20, 9, 0, 7); g.fill(); } }
  // لافتة البداية
  g.fillStyle = '#8A5A3C'; g.fillRect(LX - 398, GROUND - 150, 16, 160);
  g.fillStyle = '#E9C58C'; g.strokeStyle = INK; g.lineWidth = 5; rr(LX - 490, GROUND - 236, 200, 92, 12); g.fill(); g.stroke();
  txt('البداية', LX - 390, GROUND - 188, 54, INK);
  g.fillStyle = '#7A6548'; g.beginPath(); g.ellipse(LX, GROUND + 6, 150, 20, 0, 0, 7); g.fill();
}
function txt(s, x, y, size, col, o = {}) {
  g.save(); g.font = `${size}px Lalezar`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.direction = 'rtl'; g.lineJoin = 'round';
  if (o.stroke) { g.strokeStyle = o.strokeCol || CREAM; g.lineWidth = o.stroke; g.strokeText(s, x, y); }

}
function ladder(t, lit) {
  wt();
  const yt = CAM.y - 1100 / CAM.z, yb = Math.min(GROUND + 6, CAM.y + 1100 / CAM.z), topEnd = ry(96);
  const y0 = Math.max(yt, topEnd);
