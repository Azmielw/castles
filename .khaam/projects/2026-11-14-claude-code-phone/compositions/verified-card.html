<template>
  <!--
    Still verified-text card (Khaam Motion 1.7): a quoted text (an ayah, a hadith, a saying, a line from a book, a
    law, a study) with its reference line under it. The card comes in whole, stays perfectly still, and leaves whole.

    The card is still; the world behind it is not (2026-11-12, pace standard P4-P8, P12): keep the camera and the
    scene moving under a soft plate (S.plate) while the card is read: light changing, small life, a slow push or a
    parallax track. A frozen frame under a still card read as a dead video.
    Narrated: generate the quote inside the whole narration, never as its own short chunk and never patched (a
    designed voice read «أَحْيَانَا» as «أحيانًا» in a short chunk and right inside the whole take); check every take
    word by word with scripts/check_quote.py; only the user's ear clears it (reference/voiceover.md). No figure on
    screen while the voice speaks of a prophet or a companion or reads his words: show the place and the light.

    The text and its reference come from the user, copied from a source they checked (for an ayah: the mushaf or
    a trusted Quran site; for a hadith: the collection with its number and grade). Claude never writes them from
    memory, never "fixes" a word, never shortens them. Put the place it was copied from in SOURCE (it goes into
    the project notes, not on screen).

    Never animated word by word: no word lighting, no highlight or line under its words, no typing effect, no
    motion on the text. Sound: put the card's span (SHOW to HIDE) in "scripture" in plan/sound.json
    (reference/film-sound.md); the mixer then keeps effects out from 0.5 s before to 0.5 s after, and no music.
    A second language line is optional and needs its own credit (who translated it).

    Nothing changes or glints under the card (2026-11-13, the wisdom rerun: the next room's man showed through the
    card as it faded out, and a twinkling star beside «النَّبِيُّ» could be read as a mark). The card fades in over
    0.6 s from SHOW and out over the 0.6 s before HIDE; SHOW to HIDE is its whole span. With the scene kit
    (kit/kit.js), this card tells the kit its span and box (Khaam.card) and the kit keeps them clear: a place change
    that would still be running at SHOW, or starts in the card's first half, ends as the card comes in; one that
    starts in its second half waits for HIDE; and stars that would pass within 40 px of the card while it is up go
    out just before it and come back after it
    (the console says each move). So time the next place at HIDE or later ("card:end" in plan/beats.txt) and the
    one before it to end by SHOW; a scene drawn without the kit keeps the same rule by hand (Khaam.cards, or SHOW
    and HIDE), and no speck or glint of its own behind a vowelled text.
  -->
  <style>
    @font-face { font-family: "Display"; src: url("assets/fonts/display.ttf"); font-weight: 100 900; }
    @font-face { font-family: "Second"; src: url("assets/fonts/text.ttf"); font-weight: 100 900; }
    #vc-root { position: absolute; inset: 0; pointer-events: none; }
    .vc-card {
      position: absolute; left: 70px; right: 70px; padding: 56px 56px 48px; border-radius: 28px;
      background: rgba(8, 12, 26, 0.62); border: 2px solid rgba(242, 196, 109, 0.45);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      display: flex; flex-direction: column; align-items: center; gap: 26px; opacity: 0; visibility: hidden;
    }
    .vc-kind { font-family: "Display", serif; font-weight: 700; font-size: 36px; color: var(--accent, #f2c46d); }
    .vc-text {
      font-family: "Display", serif; font-weight: 400; font-size: 64px; line-height: 1.9; text-align: center;
      color: var(--ink, #f4eee3); white-space: pre-line;
    }
    .vc-rule { width: 120px; height: 2px; background: var(--accent, #f2c46d); opacity: 0.6; }
    .vc-ref {
      font-family: "Display", serif; font-weight: 700; font-size: 34px; line-height: 1.6; text-align: center;
      color: var(--accent, #f2c46d); white-space: pre-line;
    }
    /* LOOK = "sky": no box, a soft edgeless shade, so the card does not read as an app dialog over a drawn sky */
    .vc-card.sky {
      left: 40px; right: 40px; padding: 70px 40px; border-radius: 0; border: none; box-shadow: none;
      background: radial-gradient(closest-side, rgba(6, 10, 28, 0.40) 0%, rgba(6, 10, 28, 0.22) 60%, rgba(6, 10, 28, 0) 100%);
    }
    .vc-card.sky .vc-kind, .vc-card.sky .vc-ref { text-shadow: 0 2px 14px rgba(4, 8, 20, 0.75); }
    .vc-card.sky .vc-text { text-shadow: 0 3px 22px rgba(4, 8, 20, 0.65); }
    .vc-second {
      font-family: "Second", serif; font-weight: 500; font-size: 38px; line-height: 1.3; text-align: center;
      color: var(--ink, #f4eee3); opacity: 0.88; white-space: pre-line;
    }
    .vc-credit { font-family: "Second", serif; font-weight: 500; font-size: 28px; color: var(--ink, #f4eee3); opacity: 0.6; }
  </style>
  <div id="vc-root" data-composition-id="verified-card" data-width="1080" data-height="1920">
    <div class="vc-card" id="vc-card">
      <div class="vc-kind" id="vc-kind" dir="rtl"></div>
      <div class="vc-text" id="vc-text" dir="rtl"></div>
      <div class="vc-rule"></div>
      <div class="vc-ref" id="vc-ref" dir="rtl"></div>
      <div class="vc-second" id="vc-second" dir="ltr"></div>
      <div class="vc-credit" id="vc-credit" dir="ltr"></div>
    </div>
  </div>
  <script>
    (function () {
      // ---- edit here: the user's text, exactly as they gave it ----------------------------------------------
      var CARD = {
        kind: "حكمة",                    // what it is: «قال الله تعالى» / «قال رسول الله ﷺ» / «حكمة» / «من كتاب …»
        text: "النص كما أعطاك إياه المستخدم",   // exact; line breaks with \n where the user wants them
        reference: "المرجع كما أعطاك إياه",     // e.g. «سورة الأنبياء: ٨٧»; a hadith on two lines with \n: «رواه البخاري (٦٤٠٧)\nصحيح» (a line break, never a «·» next to Arabic letters)
        second: "",                      // optional translation
        secondCredit: "",                // who translated it (required when second is used)
        source: "",                      // where the user copied it from (not shown; keep it in the notes)
      };
      var SHOW = 0.5, HIDE = 6.5;          // seconds, or a spoken word / cue name ("…", "…:end") from timing.js
      var TOP = 640;                      // y of the card (safe area: 250-1540)
      var LOOK = "box";                   // "box" = the dark card with a gold edge; "sky" = no box, a soft shade (over a drawn scene)
      var CARD_FONT = "";                 // a fully vowelled text: "assets/fonts/card.ttf" (Scheherazade New or Noto Naskh Arabic: in HyperFrames, Amiri and Amiri Quran set harakat off their letters); "" = the display font
      // ------------------------------------------------------------------------------------------------------
      SHOW = typeof SHOW === "number" ? SHOW : window.cue(SHOW);
      HIDE = typeof HIDE === "number" ? HIDE : window.cue(HIDE);
      if (CARD_FONT) {   // loaded only when named, so a project without it has no missing file
        var st = document.createElement("style");
        st.textContent = '@font-face { font-family: "Card"; src: url("' + CARD_FONT + '"); font-weight: 100 900; }';
        document.head.appendChild(st);
        document.getElementById("vc-text").style.fontFamily = '"Card", "Display", serif';
      }
      if (CARD.second && !CARD.secondCredit) throw new Error("verified-card: a translation needs its credit (secondCredit).");
      var card = document.getElementById("vc-card");
      card.style.top = TOP + "px";
      if (LOOK === "sky") card.classList.add("sky");
      document.getElementById("vc-kind").textContent = CARD.kind;
      document.getElementById("vc-text").textContent = CARD.text;
      document.getElementById("vc-ref").textContent = CARD.reference;
      var sec = document.getElementById("vc-second"), cr = document.getElementById("vc-credit");
      if (CARD.second) { sec.textContent = CARD.second; cr.textContent = CARD.secondCredit; }
      else { sec.remove(); cr.remove(); }
      if (!CARD.kind) document.getElementById("vc-kind").remove();
      var tl = gsap.timeline({ paused: true });
      tl.set(card, { visibility: "visible" }, SHOW);
      tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, SHOW);   // the whole card, once
      tl.to(card, { opacity: 0, duration: 0.6, ease: "power1.inOut" }, HIDE - 0.6);
      tl.set(card, { visibility: "hidden" }, HIDE);
      window.__timelines["verified-card"] = tl;
      // the card's span and box to the scene kit: nothing changes or glints under it (see the note at the top)
      if (window.Khaam && window.Khaam.card) {
        var box = function () {
          return { x0: card.offsetLeft, y0: card.offsetTop, x1: card.offsetLeft + card.offsetWidth, y1: card.offsetTop + card.offsetHeight };
        };
        var first = box();
        window.Khaam.card({ show: SHOW, hide: HIDE, box: first });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {   // the card font can make it taller
          var b = box();
          if (b.y1 > first.y1 + 1 || b.y0 < first.y0 - 1) window.Khaam.card({ show: SHOW, hide: HIDE, box: b });
        });
      }
    })();
  </script>
</template>
