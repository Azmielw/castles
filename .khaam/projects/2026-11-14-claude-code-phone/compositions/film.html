        rain.appendChild(col);
        var speed = 55 + R() * 70, y0 = -3200 + R() * 900;
        gsap.set(col, { y: y0, opacity: 0.45 + R() * 0.55 });

      tl.to("#glow", { x: 260, y: -420, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
