<!doctype html>
<!--
  khaam-motion HyperFrames starter (Arabic, 9:16, 8 s). Copy this folder into the video's folder, then:
  fonts → assets/fonts/display.ttf and text.ttf (the same file when there is no second language), words → timing.js (scripts/cues.py), look → the :root variables (<skill>/reference/hyperframes.md).
  Arabic rules: dir="rtl" on every row of separate words, never on <html>; whole words only, never letter splits.
-->
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <!-- The narration's word times and cue("<spoken word>"): made by scripts/cues.py build -->
    <script src="timing.js"></script>
    <!-- Drawn worlds and faceless people (reference/scene-kit.md, figure-kit.md): uncomment what the video uses.
    <script src="kit/kit.js"></script>
    <script src="kit/scene.js"></script>
    <script src="kit/figure.js"></script>
    <script src="kit/paper.js"></script>
    -->
    <style>
      :root {
        --bg: #13100e;      /* background */
        --ink: #f4efe6;     /* text */
        --accent: #ef8a5e;  /* one accent colour */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="70.5" data-fps="30"
         data-width="1080" data-height="1920">
      <div id="film" data-composition-id="film" data-composition-src="compositions/film.html"
           data-start="0" data-duration="70.5" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <audio id="vo" class="clip" src="assets/mix.wav" data-start="0" data-duration="70.5"
             data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
