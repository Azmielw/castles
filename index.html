<style>
/* Layout: one column on phones, form beside merchant list on wide screens; statement opens as a full panel */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#18202E; --muted:#5D6678; --line:#DDE1EA;
  --accent:#2C47C9; --accent-ink:#FFFFFF; --gold:#B7801A; --gold-soft:#F7EBD2; --danger:#C2362F; --soft:#EAEDF7;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141D; --surface:#181E2A; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2A3242;
  --accent:#7D93FF; --accent-ink:#0E1220; --gold:#E2AE4E; --gold-soft:#3A2F17; --danger:#FF7B72; --soft:#222A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141D; --surface:#181E2A; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2A3242;
  --accent:#7D93FF; --accent-ink:#0E1220; --gold:#E2AE4E; --gold-soft:#3A2F17; --danger:#FF7B72; --soft:#222A3A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.1rem;margin:0}
.sub{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
label{font-weight:600;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp-list{display:flex;flex-direction:column;gap:8px}
.exp{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:6px;align-items:center}
.exp .price{position:relative}
.exp .price input{padding-left:24px;direction:ltr;text-align:left}
.exp .price span{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem}
.icon{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;height:38px;cursor:pointer;font-size:1.1rem}
.icon:hover{color:var(--danger);border-color:var(--danger)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.link{background:transparent;color:var(--accent);padding:4px 0;align-self:flex-start}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.total-bar{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:8px;padding:10px 14px;font-weight:600}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.big{font-family:var(--display);font-size:1.25rem}
.msg{font-size:.88rem;color:var(--muted);min-height:1.4em;margin:0}
.msg.ok{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.3rem}
.stat small{color:var(--muted)}
.mlist{display:flex;flex-direction:column}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;font:inherit;color:inherit;text-align:right;width:100%}
.m:first-child{border-top:0}
.m:hover .mname{color:var(--accent)}
.mname{font-weight:600}
.mevents{color:var(--muted);font-size:.83rem}
.castle{font-variant-numeric:tabular-nums;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.88rem;white-space:nowrap}
.money{font-weight:700;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
/* statement */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{background:var(--ink);color:var(--bg);padding:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.sheet-head h2{font-size:1.4rem}
.sheet-head .sub{color:inherit;opacity:.75}
.sheet-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.ev{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ev-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--soft);flex-wrap:wrap}
.ev-head h3{margin:0;font-family:var(--display);font-size:1rem}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 14px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.p{text-align:left;direction:ltr;white-space:nowrap}
tr.sub td{font-weight:700;background:var(--bg)}
.entry-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);align-items:center}
.entry-tools button{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px}
.entry-tools button.del{color:var(--danger)}
.grand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grand div{border:2px solid var(--ink);border-radius:8px;padding:12px 14px}
.grand small{color:var(--muted);display:block}
.grand b{font-family:var(--display);font-size:1.5rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
textarea.copy{width:100%;min-height:160px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.banner{background:var(--gold-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.card,.sheet{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
.role{font-size:.78rem;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
[hidden]{display:none!important}
body{margin:0}
.grid.solo{grid-template-columns:minmax(0,1fr)}
.gate{max-width:520px;margin:40px auto;text-align:center}
.lock{opacity:.7}
[hidden]{display:none!important}
body{margin:0}
.grid.solo{grid-template-columns:minmax(0,1fr)}
.role{font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.auth{max-width:420px;margin:8vh auto 0;width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .tools{display:flex;gap:6px;flex-wrap:wrap}
.small{font-size:.85rem;padding:6px 10px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.paid{background:#1f8a4c;color:#fff;border:0;border-radius:999px;padding:3px 12px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.unpaid{background:transparent;color:var(--ink);border:1px dashed var(--muted);border-radius:999px;padding:3px 12px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.pill-ok{background:#1f8a4c22;color:#1f8a4c;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill-due{background:var(--soft);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.ocard{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ocard .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.okv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;font-size:.9rem}
.okv span{color:var(--muted);font-size:.78rem;display:block}
.okv b{font-weight:600;word-break:break-all}
.st{border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.st-new{background:#e8a31722;color:#b07600}.st-in_progress{background:#2c47c922;color:var(--accent)}.st-activated{background:#1f8a4c22;color:#1f8a4c}.st-rejected{background:#c2362f22;color:var(--danger)}
.badge{background:var(--danger);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:6px}
.st-issue{background:#e8701722;color:#c25a00}
.bellwrap{position:relative}
.bell{position:relative}
.bell .badge{position:absolute;top:-6px;left:-6px;margin:0}
.npanel{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0003;padding:6px}
.nitem{display:block;width:100%;text-align:right;background:none;border:0;border-radius:8px;padding:9px 10px;font:inherit;color:var(--ink);cursor:pointer}
.nitem:hover{background:var(--soft)}
.nitem.unread{font-weight:700}
.nitem small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.ocard.focus{outline:3px solid var(--accent);outline-offset:2px}
.issuebox{border-radius:8px;padding:10px 12px;background:#e8701714;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.issuebox.ok{background:#1f8a4c14}
.cred{background:var(--soft);border-radius:8px;padding:10px 14px;white-space:pre-wrap;font-variant-numeric:tabular-nums}
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h1>Team Mohpton</h1><span class="role" id="roleTag" hidden></span></div>
      <p class="sub" id="subLine">سجّل الحدث وعدد القلاع وكل مصروف بسعره.</p>
    </div>
    <div class="who" id="who" hidden><span class="bellwrap"><button class="btn ghost small bell" id="bell" aria-label="الإشعارات">🔔<span class="badge" id="bellN" hidden></span></button><div class="npanel" id="npanel" hidden></div></span><span id="whoName"></span><button class="btn ghost small" id="myPass">غيّر كلمة السر</button><button class="btn ghost small" id="logout">تسجيل خروج</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="app"><p class="sub">جاري التحميل...</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://exfxqtgcvbfpvgiykupk.supabase.co";
const SB_KEY="sb_publishable_QmYNATNjfTHYr9tZHLFz-w_iLb_jBqw";
const DOMAIN="castles.local";
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const app=$("#app");
const fmt=n=>{const v=Math.round((+n||0)*100)/100;return (v<0?"-$":"$")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dstr=t=>t?new Date(t).toISOString().slice(0,10):"";
const today=()=>new Date().toISOString().slice(0,10);
const sumExp=r=>(r.expenses||[]).reduce((s,x)=>s+(+x.price||0),0);
const ERR={username_taken:"اسم المستخدم مستعمل، اختار غيره.",bad_username:"اسم المستخدم لازم يكون 3 أحرف أو أكثر، إنجليزي أو أرقام بدون مسافات.",bad_password:"كلمة السر لازم تكون 6 أحرف أو أكثر.",bad_name:"اكتب اسم التاجر.",not_admin:"هاي العملية للأدمن بس.",admin_exists:"في أدمن موجود، سجّل دخول.",cannot_delete_self:"ما بتقدر تحذف حسابك."};

let me=null;          // profile
let events=[];        // [{id,name,has_placed}]
let records=[];       // with merchant info for admin
let merchants=[];     // admin: profiles
let filter="all";
let paid=[];
let manual=[];        // records table rows
let orders=[];        // castle activation orders
let notes=[];         // my notifications
let prices=[];        // [{merchant_id,event_id,price}]          // [{merchant_id,event_id,paid_at}]     // event id or "all"
let state={tab:"orders",open:null,editing:null,pendingDel:null,showForm:false};

async function fn(body){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(SB_URL+"/functions/v1/castles-users",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+(session?.access_token||SB_KEY)},body:JSON.stringify(body)});
  let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok) throw new Error(ERR[j.error]||j.error||"صار خطأ، جرب كمان مرة.");
  return j;
}
const evName=id=>events.find(e=>e.id===id)?.name||"";
const evPlaced=id=>!!events.find(e=>e.id===id)?.has_placed;

// ---------------- auth screens ----------------
async function showLogin(){
  $("#who").hidden=true; $("#roleTag").hidden=true; $("#subLine").textContent="ادخل باليوزر والباسورد اللي أخدتهم من الإدارة.";
  sb.rpc("castles_has_admin").then(({data})=>{if(data===false && $("#loginForm")) showSetup()});
  app.innerHTML=`<form class="card auth" id="loginForm" autocomplete="on">
    <h2>تسجيل الدخول</h2>
    <label>اسم المستخدم<input id="lUser" autocomplete="username" dir="ltr" required></label>
    <label>كلمة السر<input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></label>
    <button class="btn primary" type="submit">دخول</button>
    <p class="msg" id="lMsg" role="status"></p></form>`;
  $("#loginForm").onsubmit=async e=>{
    e.preventDefault(); const u=$("#lUser").value.trim().toLowerCase(); $("#lMsg").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:u+"@"+DOMAIN,password:$("#lPass").value});
    if(error){$("#lMsg").textContent="اليوزر أو الباسورد غلط."; return}
    boot();
  };
}
function showSetup(){
  $("#subLine").textContent="أول مرة: اعمل حساب الأدمن. بعدها بتعمل حسابات التجار من جوّا.";
  app.innerHTML=`<form class="card auth" id="setupForm">
    <h2>إنشاء حساب الأدمن</h2>
    <label>اسم المستخدم (إنجليزي)<input id="sUser" dir="ltr" required placeholder="admin"></label>
    <label>كلمة السر<input id="sPass" type="password" dir="ltr" required minlength="6"></label>
    <button class="btn primary" type="submit">أنشئ الحساب وادخل</button>
    <p class="msg" id="sMsg" role="status"></p></form>`;
  $("#setupForm").onsubmit=async e=>{
    e.preventDefault(); const u=$("#sUser").value.trim().toLowerCase(), p=$("#sPass").value;
    try{await fn({action:"bootstrap",username:u,password:p}); await sb.auth.signInWithPassword({email:u+"@"+DOMAIN,password:p}); boot()}
    catch(err){$("#sMsg").textContent=err.message}
  };
}
$("#myPass").onclick=()=>{
  if($("#myPassForm")) return $("#myPassForm").remove();
  const f=document.createElement("form"); f.id="myPassForm"; f.className="card"; f.style.maxWidth="420px";
  f.innerHTML=`<h2>غيّر كلمة السر</h2><label>كلمة السر الجديدة<input id="mpNew" type="password" dir="ltr" minlength="6" required autocomplete="new-password"></label><button class="btn primary" type="submit">احفظ</button><p class="msg" id="mpMsg"></p>`;
  app.before(f); $("#mpNew").focus();
  f.onsubmit=async e=>{e.preventDefault(); const {error}=await sb.auth.updateUser({password:$("#mpNew").value});
    if(error){$("#mpMsg").textContent=error.message.includes("different")?"اختار كلمة سر غير القديمة.":"ما تغيّرت، لازم 6 أحرف أو أكثر.";return}
    $("#mpMsg").className="msg ok"; $("#mpMsg").textContent="تغيّرت كلمة السر."; setTimeout(()=>f.remove(),1500)};
};
$("#logout").onclick=async()=>{try{sb.removeAllChannels()}catch(e){} notesOn=false;await sb.auth.signOut(); me=null; boot()};

// ---------------- data ----------------
async function loadEvents(){const {data}=await sb.from("events").select("*").order("sort").order("id"); events=data||[]}
async function loadRecords(){
  const {data,error}=await sb.from("records").select("*").order("created_at");
  if(error){banner("ما قدرت أجيب البيانات: "+error.message);return}
  manual=data||[]; rebuild();
}
function rebuild(){
  const virt=orders.filter(o=>o.status==="activated").map(o=>({id:"o_"+o.id,merchant_id:o.merchant_id,event_id:o.event_id,castles:1,placed:0,expenses:[],created_at:o.activated_at||o.created_at,fromOrder:true,igg:o.igg_id}));
  records=[...manual,...virt].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
}
async function loadNotes(){const {data}=await sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(60); notes=data||[]; renderBell()}
async function loadOrders(){const {data}=await sb.from("orders").select("*").order("created_at",{ascending:false}); orders=data||[]; rebuild()}
async function loadPrices(){const {data}=await sb.from("merchant_prices").select("*"); prices=data||[]}
const priceOf=(mid,eid)=>+(prices.find(p=>p.merchant_id===mid&&p.event_id===eid)?.price||0);
async function loadPaid(){const {data}=await sb.from("settlements").select("*"); paid=data||[]}
const paidOf=(mid,eid)=>paid.find(p=>p.merchant_id===mid&&p.event_id===eid);
async function loadMerchants(){const {data}=await sb.from("profiles").select("*").order("created_at"); merchants=data||[]}
function banner(t){const b=$("#banner"); b.hidden=!t; b.textContent=t||""}
const visible=()=>records.filter(r=>filter==="all"||r.event_id===+filter);

// ---------------- shared pieces ----------------
function chips(){
  return `<div class="chips">${[{id:"all",name:"الكل"},...events].map(e=>`<button class="chip" data-f="${e.id}" aria-pressed="${String(e.id)===String(filter)}">${esc(e.name)}</button>`).join("")}</div>`;
}
function wireChips(root,rerender){root.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;rerender()})}

function expRow(item="",price=""){
  const d=document.createElement("div"); d.className="exp";
  d.innerHTML=`<input placeholder="شو صرف؟ (مثلاً شحن)" value="${esc(item)}" aria-label="البند">
    <div class="price"><span>$</span><input type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${esc(price)}" aria-label="السعر"></div>
    <button type="button" class="icon" aria-label="احذف البند">×</button>`;
  d.querySelector("button").onclick=()=>{const l=d.parentElement;d.remove();if(!l.children.length)l.append(expRow());calcForm()};
  d.querySelectorAll("input").forEach(i=>i.oninput=calcForm);
  return d;
}
function readExps(){return [...$("#expList").children].map(r=>{const [a,b]=r.querySelectorAll("input");return {item:a.value.trim(),price:Math.round((+b.value||0)*100)/100}}).filter(x=>x.item||x.price)}
function calcForm(){const t=$("#fTotal"); if(t) t.textContent=fmt(readExps().reduce((s,x)=>s+x.price,0))}

function wireForm(forAdmin,after){
  const rec=state.editing?records.find(r=>r.id===state.editing):null;
  const sel=$("#fEvent");
  if(rec){sel.value=rec.event_id; $("#fCastles").value=rec.castles||""; $("#fPlaced").value=rec.placed||""}
  else if(filter!=="all") sel.value=filter; else if(events.length) sel.value=events[events.length-1].id;
  const tp=()=>{const on=evPlaced(+sel.value);$("#placedWrap").hidden=!on;if(!on)$("#fPlaced").value=""}; sel.onchange=tp; tp();
  const exps=rec?.expenses?.length?rec.expenses:[{},{}];
  exps.forEach(x=>$("#expList").append(expRow(x.item||"",x.price||""))); calcForm();
  $("#addExp").onclick=()=>{const r=expRow();$("#expList").append(r);r.querySelector("input").focus()};
  const ce=$("#cancelEdit"); if(ce) ce.onclick=()=>{state.editing=null;after()};
  $("#recForm").onsubmit=async e=>{
    e.preventDefault(); const msg=$("#formMsg"); msg.className="msg";
    const event_id=+sel.value, castles=Math.max(0,parseInt($("#fCastles").value)||0);
    const placed=evPlaced(event_id)?Math.max(0,parseInt($("#fPlaced").value)||0):0;
    const expenses=readExps();
    if(!castles&&!expenses.length){msg.textContent="اكتب عدد القلاع أو مصروف واحد على الأقل.";return}
    if(castles&&placed>castles){msg.textContent="القلاع اللي أخدت موقع أكثر من عدد القلاع.";return}
    const merchant_id=me.id;
    if(!merchant_id){msg.textContent="اعمل حساب لتاجر أول.";return}
    $("#saveBtn").disabled=true;
    const row={merchant_id,event_id,castles,placed,expenses};
    const q=rec?sb.from("records").update(row).eq("id",rec.id):sb.from("records").insert(row);
    const {error}=await q;
    $("#saveBtn").disabled=false;
    if(error){msg.textContent="ما انحفظ: "+error.message;return}
    state.editing=null; await loadRecords(); after(rec?"تم التعديل.":"تم الحفظ.");
  };
}

function statementText(name,list){
  const evIds=[...new Set(list.map(r=>r.event_id))]; let t=`كشف التاجر: ${name}\nالتاريخ: ${today()}\n`; let tc=0,tm=0,tv=0; const mid=list[0]?.merchant_id;
  evIds.forEach(id=>{
    const rows=list.filter(r=>r.event_id===id); const c=rows.reduce((s,r)=>s+r.castles,0); const ex=rows.flatMap(r=>r.expenses||[]); const m=ex.reduce((s,x)=>s+(+x.price||0),0);
    tc+=c; tm+=m; t+=`\n▪️ حدث ${evName(id)}\nعدد القلاع: ${c}\n`;
    if(evPlaced(id)) t+=`القلاع اللي أخدت موقع: ${rows.reduce((s,r)=>s+(r.placed||0),0)}\n`;
    const pr=priceOf(mid,id), v=c*pr; tv+=v;
    t+=`سعر القلعة: ${fmt(pr)}\nالمجموع: ${c} × ${fmt(pr)} = ${fmt(v)}\n`;
    ex.forEach(x=>t+=`- ${x.item||"مصروف"}: ${fmt(x.price)}\n`); t+=`مجموع مصاريف الحدث: ${fmt(m)}\nالصافي: ${fmt(v-m)}${paidOf(mid,id)?" ✓ تمت":""}\n`;
  });
  return t+`\n━━━━━━━━\nمجموع القلاع: ${tc}\nالمجموع: ${fmt(tv)}\nناقص المصاريف: ${fmt(tm)}\nالصافي: ${fmt(tv-tm)}`;
}
function payCtl(mid,eid){
  if(!mid) return ""; const p=paidOf(mid,eid); const admin=me?.role==="admin";
  if(admin) return p?`<button class="paid" data-pay="${eid}" title="اضغط للتراجع">✓ تمت · ${dstr(p.paid_at)}</button>`:`<button class="unpaid" data-pay="${eid}">علّم تمت</button>`;
  return p?`<span class="pill-ok">✓ تمت</span>`:"";
}
function sheetHTML(name,list,opts={}){
  const evIds=[...new Set(list.map(r=>r.event_id))]; let tc=0,tm=0,tv=0; const mid=opts.mid||list[0]?.merchant_id; const admin=me?.role==="admin";
  const blocks=evIds.map(id=>{
    const rows=list.filter(r=>r.event_id===id); const c=rows.reduce((s,r)=>s+r.castles,0); const m=rows.reduce((s,r)=>s+sumExp(r),0); tc+=c; tm+=m;
    const pl=rows.reduce((s,r)=>s+(r.placed||0),0);
    const exRows=rows.flatMap(r=>(r.expenses||[]).map(x=>`<tr><td>${esc(x.item||"مصروف")}</td><td class="p">${fmt(x.price)}</td></tr>`)).join("")||`<tr><td colspan="2" style="color:var(--muted)">ما في مصاريف بهالحدث</td></tr>`;
    const tools=rows.map(r=>`<div class="entry-tools"><span>${r.fromOrder?`طلب تفعيل ${dstr(r.created_at)}: قلعة واحدة · IGG ${esc(r.igg)}`:`تسجيل ${dstr(r.created_at)}: ${r.castles} قلعة${evPlaced(r.event_id)?`، ${r.placed||0} موقع`:""}، ${fmt(sumExp(r))}`}</span>
      ${r.merchant_id===me.id&&!r.fromOrder?`<button data-edit="${r.id}">تعديل</button><button class="del" data-del="${r.id}">${state.pendingDel===r.id?"متأكد؟ اضغط للحذف":"حذف"}</button>`:""}</div>`).join("");
    return `<div class="ev"><div class="ev-head"><h3>حدث ${esc(evName(id))}</h3><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="castle">${c} قلعة</span>${evPlaced(id)?`<span class="castle">${pl} أخدت موقع</span>`:""}${payCtl(opts.mid,id)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>شو صرف</th><th style="text-align:left">المبلغ</th></tr></thead><tbody>${exRows}
      <tr class="sub"><td>مجموع مصاريف الحدث</td><td class="p">${fmt(m)}</td></tr></tbody></table></div>
      ${(()=>{const pr=priceOf(mid,id), v=c*pr; tv+=v; return `<div class="tbl-wrap"><table><tbody>
        <tr><td>سعر القلعة</td><td class="p">${fmt(pr)}</td></tr>
        <tr><td>المجموع (${c} × ${fmt(pr)})</td><td class="p">${fmt(v)}</td></tr>
        <tr><td>ناقص المصاريف</td><td class="p">− ${fmt(m)}</td></tr>
        <tr class="sub"><td>الصافي</td><td class="p" style="font-size:1.05rem">${fmt(v-m)}</td></tr></tbody></table></div>`})()}
      ${tools}</div>`;
  }).join("");
  return `<div class="actions" style="margin-bottom:12px">${opts.back?`<button class="btn ghost" id="back">→ رجوع للقائمة</button>`:""}
      ${list.length?`<button class="btn primary" id="copyBtn">انسخ الكشف للواتساب</button>`:""}</div>
    <div class="sheet"><div class="sheet-head"><div><h2>${esc(name)}</h2><p class="sub">كشف جرد${filter!=="all"?" · حدث "+esc(evName(+filter)):""} · ${today()}</p></div></div>
    <div class="sheet-body">
      ${admin&&opts.mid?`<div class="ev"><div class="ev-head"><h3>💲 أسعار القلعة لهالتاجر</h3><span class="mevents">بتنحفظ لحالها</span></div>
        <div class="tbl-wrap"><table><tbody>${events.map(e=>`<tr><td>حدث ${esc(e.name)}</td><td class="p"><span style="display:inline-flex;gap:6px;align-items:center">$<input type="number" min="0" step="0.01" data-price="${e.id}" value="${priceOf(mid,e.id)||""}" placeholder="0.00" style="width:110px;padding:5px 8px;direction:ltr"></span></td></tr>`).join("")}</tbody></table></div></div>`:""}
      ${blocks}
      <div class="grand"><div><small>مجموع القلاع اللي اشترك فيها</small><b class="num">${tc}</b></div><div><small>المجموع (القلاع × السعر)</small><b class="num">${fmt(tv)}</b></div>
        <div><small>ناقص المصاريف اللي صرفها</small><b class="num">${fmt(tm)}</b></div><div style="background:var(--soft)"><small>الصافي</small><b class="num">${fmt(tv-tm)}</b></div></div>${list.length?"":`<div class="empty">لسا ما في تسجيلات${filter!=="all"?" بهالحدث":""}.</div>`}
      <p class="msg" id="copyMsg" role="status"></p><textarea class="copy" id="copyTxt" readonly hidden></textarea>
    </div></div>`;
}
function wireSheet(root,name,list,rerender,onEdit){
  const cb=root.querySelector("#copyBtn"); if(cb) cb.onclick=async()=>{
    const txt=statementText(name,list); const m=root.querySelector("#copyMsg");
    try{await navigator.clipboard.writeText(txt);m.className="msg ok";m.textContent="انتسخ الكشف، الصقه بالواتساب وابعته."}
    catch(e){const ta=root.querySelector("#copyTxt");ta.hidden=false;ta.value=txt;ta.select();m.textContent="حدد النص وانسخه يدوياً."}
  };
  root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>onEdit(b.dataset.edit));
  root.querySelectorAll("[data-price]").forEach(inp=>inp.onchange=async()=>{
    const eid=+inp.dataset.price, mid=state.open; if(!mid) return;
    const price=Math.max(0,Math.round((+inp.value||0)*100)/100);
    const {error}=await sb.from("merchant_prices").upsert({merchant_id:mid,event_id:eid,price,updated_at:new Date().toISOString()});
    if(error){root.querySelector("#copyMsg").textContent="ما انحفظ السعر: "+error.message;return}
    await loadPrices(); rerender();
  });
  root.querySelectorAll("[data-pay]").forEach(b=>b.onclick=async()=>{
    const eid=+b.dataset.pay, mid=state.open; if(!mid) return; b.disabled=true;
    const {error}=paidOf(mid,eid)?await sb.from("settlements").delete().eq("merchant_id",mid).eq("event_id",eid):await sb.from("settlements").insert({merchant_id:mid,event_id:eid,paid_by:me.id});
    if(error){root.querySelector("#copyMsg").textContent="ما انحفظ: "+error.message;b.disabled=false;return}
    await loadPaid(); rerender();
  });
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del; if(state.pendingDel!==id){state.pendingDel=id;rerender();return}
    state.pendingDel=null; const {error}=await sb.from("records").delete().eq("id",id);
    if(error){root.querySelector("#copyMsg").textContent="ما انحذف: "+error.message;return}
    await loadRecords(); rerender();
  });
}

function renderMerchant(flash){
  const mt=state.mtab||"orders";
  const tabsHTML=`<div class="tabs" role="tablist">${[["orders","الطلبات"],["inv","الجرد والمصاريف"]].map(([k,l])=>`<button class="tab" role="tab" data-mt="${k}" aria-selected="${mt===k}">${l}</button>`).join("")}</div>`;
  if(mt==="orders"){app.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${tabsHTML}<div id="opane"></div></div>`;
    app.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{state.mtab=b.dataset.mt;renderMerchant()});
    ordersPane($("#opane"),()=>renderMerchant()); return}
  const list=visible();
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${tabsHTML}${chips()}
    <section class="grid">${formHTML(false)}<div id="mine" style="min-width:0">${sheetHTML(me.display_name,list,{mid:me.id})}</div></section></div>`;
  app.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{state.mtab=b.dataset.mt;renderMerchant()});
  wireChips(app,()=>renderMerchant());
  wireForm(false,(m)=>renderMerchant(m));
  if(flash){$("#formMsg").className="msg ok";$("#formMsg").textContent=flash}
  wireSheet($("#mine"),me.display_name,list,()=>renderMerchant(),id=>{state.editing=id;renderMerchant();$("#recForm").scrollIntoView({behavior:"smooth"})});
}

function orderCard(o,admin,nameOf){
  const copyBtn=(v)=>v?` <button type="button" class="btn ghost small" data-copy="${esc(v)}" style="padding:2px 8px">نسخ</button>`:"";
  const msg=`تم تفعيل القلعة ✅\nالحدث: ${evName(o.event_id)}\nIGG ID: ${o.igg_id}`;
  const own=o.merchant_id===me.id;
  const when=d=>new Date(d).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"});
  const sdata=[o.igg_id,o.game_email,o.telegram,nameOf(o.merchant_id)].join(" ").toLowerCase();
  return `<div class="ocard" id="oc-${o.id}" data-s="${esc(sdata)}"><div class="head"><b>${admin?esc(nameOf(o.merchant_id))+" · ":""}حدث ${esc(evName(o.event_id))}</b><span style="display:flex;gap:6px;flex-wrap:wrap">${o.issue_state==="open"?`<span class="st st-issue">🟠 فيها مشكلة</span>`:""}<span class="st st-${o.status}">${ST[o.status]}</span></span></div>
    <div class="okv">
      <div><span>الإيميل</span><b dir="ltr">${esc(o.game_email)}</b>${admin?copyBtn(o.game_email):""}</div>
      <div><span>الباسورد</span><b dir="ltr">${o.game_password?esc(o.game_password):"-"}</b>${admin&&o.game_password?copyBtn(o.game_password):""}</div>
      <div><span>IGG ID</span><b dir="ltr">${esc(o.igg_id)}</b>${admin?copyBtn(o.igg_id):""}</div>
      <div><span>تلجرام</span><b dir="ltr">${esc(o.telegram||"-")}</b></div>
      <div><span>وقت الطلب</span><b dir="ltr">${when(o.created_at)}</b></div>
      ${o.activated_at?`<div><span>وقت التفعيل</span><b dir="ltr">${when(o.activated_at)}</b></div>`:""}
    </div>
    ${o.note?`<div class="mevents">ملاحظة: ${esc(o.note)}</div>`:""}
    ${o.status==="rejected"?`<div style="color:var(--danger);font-size:.9rem">سبب الرفض: ${esc(o.reject_reason||"")}</div>`:""}
    ${o.issue_state?`<div class="issuebox ${o.issue_state==="resolved"?"ok":""}">
      <div><b>${o.issue_state==="open"?"🟠 مشكلة":"✓ انحلت المشكلة"}</b> <span class="mevents" dir="ltr">${when(o.issue_at)}</span></div>
      <div>${esc(o.issue_note||"")}</div>
      ${o.issue_state==="resolved"?`<div class="mevents">${o.issue_reply?"رد الإدارة: "+esc(o.issue_reply)+" · ":""}<span dir="ltr">${when(o.issue_resolved_at||o.updated_at)}</span></div>`:""}
      ${admin&&o.issue_state==="open"?`<div style="display:flex;gap:6px;flex-wrap:wrap"><input id="rs-${o.id}" placeholder="ردّك (اختياري)" style="max-width:260px"><button class="btn primary small" data-resolve="${o.id}">انحلت ✓</button></div>`:""}
    </div>`:""}
    <div class="actions">
      ${admin&&o.status!=="activated"?`${o.status!=="in_progress"?`<button class="btn ghost small" data-ost="${o.id}|in_progress">قيد التفعيل</button>`:""}<button class="btn primary small" data-ost="${o.id}|activated">تفعّل ✓</button>${o.status!=="rejected"?`<button class="btn danger small" data-ost="${o.id}|rejected">رفض</button>`:""}`:""}
      ${o.status==="activated"?`<button class="btn ghost small" data-copy="${esc(msg)}">انسخ رسالة التفعيل</button>`:""}
      ${own&&o.status==="activated"&&o.issue_state!=="open"?`<button class="btn danger small" data-issue="${o.id}">لسا ما تفعّلت؟</button>`:""}
      ${own&&(o.status==="new"||o.status==="rejected")?`<button class="btn ghost small" data-oedit="${o.id}">تعديل</button>`:""}
      ${own&&o.status==="new"?`<button class="btn danger small" data-odel="${o.id}">${state.pendingDel===o.id?"متأكد؟":"حذف"}</button>`:""}
    </div>
    ${own&&o.status==="activated"&&o.issue_state!=="open"?`<div id="is-${o.id}" hidden style="display:flex;flex-direction:column;gap:6px"><textarea placeholder="اشرح المشكلة (مثلاً: القلعة لسا مش ظاهرة باللعبة)" style="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:70px"></textarea><span class="mevents">اكتب المشكلة واضغط "لسا ما تفعّلت؟" كمان مرة للإرسال</span></div>`:""}
    ${admin?`<div id="rj-${o.id}" hidden style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input placeholder="سبب الرفض (مثلاً الباسورد غلط)" style="max-width:280px"><span class="mevents">اضغط رفض كمان مرة للتأكيد</span></div>`:""}
  </div>`;
}

// ---------------- admin view ----------------
function renderAdmin(flash){
  const nNew=orders.filter(o=>o.status==="new"||o.issue_state==="open").length;
  const tabs=[["orders","الطلبات"+(nNew?`<span class="badge">${nNew}</span>`:"")],["merchants","التجار"],["accounts","الحسابات"],["events","الأحداث"]];
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}</div>
    <div id="pane"></div></div>`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.open=null;state.editing=null;renderAdmin()});
  const pane=$("#pane");
  if(state.tab==="orders") ordersPane(pane,()=>renderAdmin());
  if(state.tab==="merchants") adminMerchants(pane,flash);
  if(state.tab==="accounts") adminAccounts(pane);
  if(state.tab==="events") adminEvents(pane);
}
function adminMerchants(pane,flash){
  const name=id=>merchants.find(m=>m.id===id)?.display_name||"تاجر محذوف";
  if(state.open && !state.editing){
    const list=visible().filter(r=>r.merchant_id===state.open);
    pane.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>اختار الحدث:</b>${chips()}</div><div id="sheet">${sheetHTML(name(state.open),list,{back:true,mid:state.open})}</div></div>`;
    wireChips(pane,()=>renderAdmin()); $("#back").onclick=()=>{state.open=null;renderAdmin()};
    wireSheet($("#sheet"),name(state.open),list,()=>renderAdmin(),id=>{state.editing=id;state.showForm=true;renderAdmin()});
    return;
  }
  const agg=new Map();
  merchants.forEach(m=>agg.set(m.id,{id:m.id,name:m.display_name+(m.role==="admin"?" (أدمن)":""),user:m.username,castles:0,placed:0,money:0,n:0,last:0}));
  visible().forEach(r=>{const o=agg.get(r.merchant_id); if(!o) return; o.castles+=r.castles; o.placed+=r.placed||0; (o.evs=o.evs||new Set()).add(r.event_id); o.money+=sumExp(r); o.value=(o.value||0)+r.castles*priceOf(r.merchant_id,r.event_id); o.n++; o.last=Math.max(o.last,+new Date(r.created_at))});
  const q=(state.q||"").trim();
  const all=[...agg.values()].sort((a,b)=>b.last-a.last);
  const list=all.filter(m=>!q||m.name.includes(q)||m.user.includes(q.toLowerCase()));
  const showPlaced=filter==="all"?events.some(e=>e.has_placed):evPlaced(+filter);
  pane.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${chips()}
   <section class="grid ${state.showForm?"":"solo"}">
    ${state.showForm?formHTML(true):""}
    <div class="card">
      <div class="toprow"><h2>كل التجار</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="search" placeholder="ابحث عن تاجر" value="${esc(state.q||"")}" style="max-width:200px">
        <button class="btn ghost" id="toggleForm">${state.showForm?"إخفاء النموذج":"+ سجّل تفاصيلي"}</button></div></div>
      <div class="stats">
        <div class="stat"><small>التجار</small><b class="num">${all.length}</b></div>
        <div class="stat"><small>مجموع القلاع</small><b class="num">${all.reduce((s,m)=>s+m.castles,0)}</b></div>
        <div class="stat"><small>مجموع المصاريف</small><b class="num">${fmt(all.reduce((s,m)=>s+m.money,0))}</b></div>
        <div class="stat"><small>الصافي</small><b class="num">${fmt(all.reduce((s,m)=>s+(m.value||0)-m.money,0))}</b></div>
      </div>
      <div class="mlist">${list.length?list.map(m=>`<button class="m" data-open="${m.id}">
        <span><span class="mname">${esc(m.name)}</span><br><span class="mevents">${m.n} تسجيل · ${esc(m.user)}</span> ${m.evs?([...m.evs].every(e=>paidOf(m.id,e))?`<span class="pill-ok">✓ تمت</span>`:`<span class="pill-due">باقي</span>`):""}</span>
        <span class="castle">${m.castles} قلعة${showPlaced&&m.placed?` · ${m.placed} موقع`:""}</span><span class="money num" title="الصافي">${fmt((m.value||0)-m.money)}</span></button>`).join("")
        :`<div class="empty">${all.length?"ما في نتائج.":"لسا ما في تجار. روح على تبويب الحسابات واعمل حساب لكل تاجر."}</div>`}</div>
    </div></section></div>`;
  wireChips(pane,()=>renderAdmin());
  $("#search").oninput=e=>{state.q=e.target.value;const pos=e.target.selectionStart;renderAdmin();const s=$("#search");s.focus();s.setSelectionRange(pos,pos)};
  $("#toggleForm").onclick=()=>{state.showForm=!state.showForm;state.editing=null;renderAdmin()};
  pane.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{state.open=b.dataset.open;renderAdmin()});
  if(state.showForm){wireForm(true,m=>{renderAdmin(m)}); if(flash){$("#formMsg").className="msg ok";$("#formMsg").textContent=flash}}
}
function adminAccounts(pane){
  pane.innerHTML=`<section class="grid">
    <form class="card" id="newUser" autocomplete="off">
      <h2>حساب جديد</h2>
      <label>اسم التاجر<input id="uName" required placeholder="مثلاً: أبو أحمد"></label>
      <div class="row2"><label>اسم المستخدم<input id="uUser" dir="ltr" required placeholder="abuahmad"></label>
      <label>كلمة السر<input id="uPass" dir="ltr" required minlength="6"></label></div>
      <div class="row2"><label>رقم التلفون (اختياري)<input id="uPhone" dir="ltr"></label>
      <label>النوع<select id="uRole"><option value="merchant">تاجر</option><option value="admin">أدمن</option></select></label></div>
      <div><div style="font-weight:600;font-size:.88rem;margin-bottom:6px">💲 سعر القلعة لكل حدث</div>
        <div class="row2">${events.map(e=>`<label style="font-weight:500">${esc(e.name)}<span style="display:flex;gap:6px;align-items:center">$<input type="number" min="0" step="0.01" data-np="${e.id}" placeholder="0.00" dir="ltr"></span></label>`).join("")}</div></div>
      <button class="btn ghost small" type="button" id="genPass" style="align-self:flex-start">اقترح كلمة سر</button>
      <button class="btn primary" type="submit">أنشئ الحساب</button>
      <p class="msg" id="uMsg" role="status"></p>
      <div class="cred" id="cred" hidden></div>
      <button class="btn ghost small" type="button" id="copyCred" hidden style="align-self:flex-start">انسخ بيانات الدخول</button>
    </form>
    <div class="card"><h2>كل الحسابات</h2><div id="ulist">${merchants.map(m=>`<div class="urow"><div><b>${esc(m.display_name)}</b> <span class="role">${m.role==="admin"?"أدمن":"تاجر"}</span><br><span class="mevents" dir="ltr">${esc(m.username)}${m.phone?" · "+esc(m.phone):""}</span><div id="act-${m.id}"></div></div>
      <div class="tools"><button class="btn ghost small" data-pr="${m.id}">💲 الأسعار</button>${m.id===me.id?"":`<button class="btn ghost small" data-pw="${m.id}">تغيير الباسورد</button><button class="btn danger small" data-rm="${m.id}">${state.pendingDel===m.id?"متأكد؟ بيمحي تسجيلاته":"حذف"}</button>`}</div></div>`).join("")}</div></div>
  </section>`;
  const gen=()=>{const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint32Array(8));r.forEach(x=>s+=a[x%a.length]);return s};
  $("#genPass").onclick=()=>$("#uPass").value=gen();
  $("#newUser").onsubmit=async e=>{
    e.preventDefault(); const m=$("#uMsg"); m.className="msg"; m.textContent="";
    const body={action:"create",display_name:$("#uName").value.trim(),username:$("#uUser").value.trim().toLowerCase(),password:$("#uPass").value,phone:$("#uPhone").value.trim(),role:$("#uRole").value};
    try{const res=await fn(body);
      const pr=[...pane.querySelectorAll("[data-np]")].filter(i=>i.value!=="").map(i=>({merchant_id:res.id,event_id:+i.dataset.np,price:Math.max(0,Math.round((+i.value||0)*100)/100)}));
      if(res.id&&pr.length){await sb.from("merchant_prices").upsert(pr); await loadPrices()}
      await loadMerchants();
      const txt=`رابط الموقع: ${location.href.split("#")[0]}\nاسم المستخدم: ${body.username}\nكلمة السر: ${body.password}`;
      adminAccounts(pane); $("#uMsg").className="msg ok"; $("#uMsg").textContent="انعمل الحساب: "+body.display_name;
      $("#cred").hidden=false; $("#cred").textContent=txt; $("#copyCred").hidden=false;
      $("#copyCred").onclick=async()=>{try{await navigator.clipboard.writeText(txt);$("#uMsg").textContent="انتسخت، ابعتها للتاجر."}catch(e){}};
    }catch(err){m.textContent=err.message}
  };
  pane.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.pr, box=$("#act-"+id); if(box.innerHTML){box.innerHTML="";return}
    box.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">${events.map(e=>`<label style="font-weight:500;font-size:.85rem">${esc(e.name)}<span style="display:flex;gap:4px;align-items:center">$<input type="number" min="0" step="0.01" data-ep="${e.id}" value="${priceOf(id,e.id)||""}" placeholder="0.00" dir="ltr" style="width:100px;padding:5px 8px"></span></label>`).join("")}</div><p class="msg" id="pmsg-${id}">بينحفظ لحاله لما تغيّر الرقم.</p>`;
    box.querySelectorAll("[data-ep]").forEach(inp=>inp.onchange=async()=>{
      const price=Math.max(0,Math.round((+inp.value||0)*100)/100);
      const {error}=await sb.from("merchant_prices").upsert({merchant_id:id,event_id:+inp.dataset.ep,price,updated_at:new Date().toISOString()});
      const m=$("#pmsg-"+id); if(error){m.className="msg";m.textContent="ما انحفظ: "+error.message;return}
      await loadPrices(); m.className="msg ok"; m.textContent="انحفظ ✓";
    });
  });
  pane.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.pw, box=$("#act-"+id);
    box.innerHTML=`<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><input id="np-${id}" dir="ltr" placeholder="كلمة سر جديدة" style="max-width:180px"><button class="btn primary small" id="ok-${id}">احفظ</button></div><p class="msg" id="pm-${id}"></p>`;
    $("#np-"+id).value=gen();
    $("#ok-"+id).onclick=async()=>{try{await fn({action:"set_password",user_id:id,password:$("#np-"+id).value});$("#pm-"+id).className="msg ok";$("#pm-"+id).textContent="تغيّرت. الباسورد الجديد: "+$("#np-"+id).value}catch(err){$("#pm-"+id).textContent=err.message}};
  });
  pane.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.rm; if(state.pendingDel!==id){state.pendingDel=id;adminAccounts(pane);return}
    state.pendingDel=null; try{await fn({action:"delete",user_id:id}); await loadMerchants(); await loadRecords(); adminAccounts(pane)}catch(err){banner(err.message)}
  });
}
function adminEvents(pane){
  pane.innerHTML=`<section class="grid">
    <form class="card" id="newEv"><h2>حدث جديد</h2>
      <label>اسم الحدث<input id="eName" required></label>
      <label style="flex-direction:row;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="ePlaced" style="width:auto"> فيه خانة "كم قلعة أخدت موقع"</label>
      <button class="btn primary" type="submit">أضف</button><p class="msg" id="eMsg"></p></form>
    <div class="card"><h2>الأحداث</h2>${events.map(e=>`<div class="urow"><div><b>${esc(e.name)}</b><br><span class="mevents">${e.has_placed?"فيه خانة الموقع":"بدون خانة الموقع"} · ${records.filter(r=>r.event_id===e.id).length} تسجيل</span></div>
      <div class="tools"><button class="btn ghost small" data-tp="${e.id}">${e.has_placed?"شيل خانة الموقع":"ضيف خانة الموقع"}</button></div></div>`).join("")}</div>
  </section>`;
  $("#newEv").onsubmit=async e=>{e.preventDefault();const {error}=await sb.from("events").insert({name:$("#eName").value.trim(),has_placed:$("#ePlaced").checked,sort:events.length+1});
    if(error){$("#eMsg").textContent=error.code==="23505"?"الحدث موجود.":error.message;return} await loadEvents(); adminEvents(pane)};
  pane.querySelectorAll("[data-tp]").forEach(b=>b.onclick=async()=>{const ev=events.find(x=>x.id===+b.dataset.tp);await sb.from("events").update({has_placed:!ev.has_placed}).eq("id",ev.id);await loadEvents();adminEvents(pane)});
}

function rerenderAll(){ if(!me) return; if(document.activeElement?.matches("input,select,textarea")) return; me.role==="admin"?renderAdmin():renderMerchant() }
function renderBell(){
  const n=notes.filter(x=>!x.read_at).length, b=$("#bellN"); if(!b) return;
  b.hidden=!n; b.textContent=n>9?"9+":n;
  const p=$("#npanel"); if(p.hidden) return;
  p.innerHTML=(notes.length?notes.map(x=>`<button class="nitem ${x.read_at?"":"unread"}" data-nid="${x.id}" data-oid="${x.order_id||""}">${esc(x.body)}<small dir="ltr">${new Date(x.created_at).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"})}</small></button>`).join(""):`<div class="empty">ما في إشعارات.</div>`)
    +(n?`<button class="btn link small" id="readAll" style="margin:4px 10px">علّم الكل مقروء</button>`:"");
  p.querySelectorAll("[data-nid]").forEach(el=>el.onclick=async()=>{
    p.hidden=true; const id=+el.dataset.nid, oid=el.dataset.oid;
    if(oid){ if(me.role==="admin") state.tab="orders"; else state.mtab="orders"; state.ofilter="all"; state.oq=""; state.focus=oid; state.open=null; me.role==="admin"?renderAdmin():renderMerchant() }
    const x=notes.find(y=>y.id===id); if(x&&!x.read_at){x.read_at=new Date().toISOString(); renderBell(); await sb.from("notifications").update({read_at:x.read_at}).eq("id",id)}
  });
  const ra=$("#readAll"); if(ra) ra.onclick=async()=>{const now=new Date().toISOString(); notes.forEach(x=>{if(!x.read_at)x.read_at=now}); renderBell(); await sb.from("notifications").update({read_at:now}).is("read_at",null)};
}
$("#bell").onclick=e=>{e.stopPropagation(); const p=$("#npanel"); p.hidden=!p.hidden; renderBell()};
document.addEventListener("click",e=>{const p=$("#npanel"); if(p&&!p.hidden&&!p.contains(e.target)) p.hidden=true});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}catch(e){}
  try{document.title="🔔 طلب جديد · Team Mohpton";setTimeout(()=>document.title="Team Mohpton",8000)}catch(e){}}
// ---------------- boot ----------------
async function boot(){
  banner("");
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  const [{data:prof}]=await Promise.all([sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle(),loadEvents(),loadRecords(),loadPaid(),loadPrices(),loadOrders(),loadNotes()]);
  if(!prof){await sb.auth.signOut(); return showLogin()}
  me=prof;
  $("#who").hidden=false; $("#whoName").textContent=me.display_name+" ("+me.username+")";
  $("#roleTag").hidden=false; $("#roleTag").textContent=me.role==="admin"?"الإدارة":"تاجر";
  startNotes();
  if(me.role==="admin"){
    $("#subLine").textContent="طلبات التفعيل والجرد لكل التجار بتوصل هون أول بأول.";
    await loadMerchants(); renderAdmin();
    sb.channel("orders-a").on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{await loadOrders(); rerenderAll()}).subscribe();
    sb.channel("records").on("postgres_changes",{event:"*",schema:"public",table:"records"},async()=>{await loadRecords(); if(!state.showForm && !document.activeElement?.matches("input,select")) renderAdmin()}).subscribe();
  } else {
    $("#subLine").textContent="أول ما يجيك حجز ابعت طلب التفعيل، وسجّل مصاريفك بالجرد.";
    renderMerchant();
    sb.channel("orders-m").on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{await loadOrders(); rerenderAll()}).subscribe();
  }
}
let notesOn=false;
async function startNotes(){
  if(notesOn) return; notesOn=true;
  sb.channel("notes-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+me.id},async(p)=>{
    notes.unshift(p.new); notes=notes.slice(0,60); renderBell(); beep();
  }).subscribe();
}
boot();
</script>
