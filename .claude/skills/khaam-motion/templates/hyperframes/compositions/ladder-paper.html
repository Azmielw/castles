<template>
  <!--
    The ladder on paper (Khaam Motion 1.7.0 of 11-12): «السلّم» told in the paper world. A small ladder stays in the page's
    margin column as the progress: its rung lights when its step comes, the top rung shows «؟» until its own step.
    In the middle, one big section per step, drawn big (a picture of ~700 px): it slides in from the left while the one
    before slides out to the right, and every section has a slow push of its own (a visible move in every scene).
    At the end (optional) the margin ladder grows into the whole ladder in the middle of the page, every step named.

    Needs in index.html, after GSAP: kit/kit.js and kit/paper.js (kit/figure.js too if a section draws ink people).
    Register it as a track like the other blocks (data-start="0" and the video's full length); when it carries the
    picture, it replaces the scene track. The spoken words go on top with word-lit.html (its plate: 0 on paper).

    Edit only the marked block: STEPS go bottom -> top; each has the title of its rung, an optional small line under it
    (a source), the cue its section comes in on (a spoken word, see timing.js / cues.py, or seconds), and draw(S, at,
    end, mid): the section's picture, drawn on its own paper stage (S) with the paper kit (S.sketch, S.ink, S.book,
    S.writing, S.mark, S.figure({style: "ink"})…), timed from `at` (the section's arrival) to `end` (its leaving),
    centred on x = mid (the middle of the column beside the rail). Set the page's ink colours in index.html: on paper,
    --ink is dark (word-lit's words use it). Whole words only; dir="rtl" on every Arabic line.
  -->
  <style>
    @font-face { font-family: "Display"; src: url("assets/fonts/display.ttf"); font-weight: 100 900; }
    @font-face { font-family: "Second"; src: url("assets/fonts/text.ttf"); font-weight: 100 900; }
    #lp-root { position: absolute; inset: 0; overflow: hidden; }
    #lp-root svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; overflow: visible; }
    .lp-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .lp-head { position: absolute; display: flex; align-items: center; gap: 22px; white-space: nowrap; }
    .lp-num { width: 76px; height: 76px; border-radius: 50%; box-sizing: border-box; border: 4px solid currentColor;
              display: flex; align-items: center; justify-content: center; font-family: "Display", serif; font-weight: 700;
              font-size: 42px; line-height: 1; flex: none; }
    .lp-title { font-family: "Display", serif; font-weight: 700; font-size: 64px; line-height: 1.35; }
    .lp-note { font-family: "Second", "Display", serif; font-weight: 500; font-size: 30px; line-height: 1.3; }
    .lp-q { position: absolute; font-family: "Display", serif; font-weight: 700; font-size: 48px; line-height: 1; }
    .lp-lab { position: absolute; font-family: "Display", serif; font-weight: 700; font-size: 50px; line-height: 1.2; white-space: nowrap; opacity: 0; }
  </style>
  <div id="lp-root" data-composition-id="ladder-paper" data-width="1080" data-height="1920">
    <svg id="lp-page" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="lp-secs" class="lp-layer" data-layout-allow-overflow data-layout-allow-overlap></div>
    <div id="lp-rail" class="lp-layer" data-layout-allow-overflow data-layout-allow-overlap><svg id="lp-railsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <svg id="lp-film" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <script>
    (function () {
      // ---- edit here ---------------------------------------------------------------------------------------
      var T = function (x) { return typeof x === "number" ? x : window.cue(x); };   // cue names or seconds
      var DURATION = 8;          // the video's length (the track's data-duration)
      var RAIL = "right";        // the margin column with the small ladder: "right" | "left"
      var PAGE = "ruled";        // the page: "ruled" | "grid" | "dotted" | "blank"
      var COLORS = {};           // paper roles to change: { ink: "#1d2b44", accent: "#d93a2e", wash: "#ffe14d" }
      var HEAD_Y = 600;          // y of each section's header (word-lit's lines sit above it)
      var SUMMARY = 5.1;         // a cue or seconds: the margin ladder grows into the whole ladder; null = none. Leave it 2.5 s or more before the end (every name read).
      var STEPS = [              // bottom -> top
        { title: "تحاول", at: 0.0, draw: function (S, at, end, mid) {
            S.sketch({ name: "again", x: mid, y: 1380, size: 2.3, still: at <= 0, at: at + 0.25, dur: 0.7, width: 6 });   // on frame 0: drawn already
            S.writing(mid + 160, 1460, [300, 240], { at: at + 0.9, each: 0.2, pencil: true });
        } },
        { title: "تتعلّم", note: "كتاب مفتوح", at: 1.4, draw: function (S, at, end, mid) {
            S.book({ x: mid, y: 1330, w: 230, h: 320, turn: [at + 0.6, at + 1.1] });
        } },
        { title: "تتقن", at: 2.8, draw: function (S, at, end, mid) {
            S.sketch({ name: "desk", x: mid, y: 1460, size: 1.4, at: at + 0.2, dur: 0.6 });
            S.sketch({ name: "notebook", x: mid - 70, y: 1250, size: 0.55, at: at + 0.6, dur: 0.4 });
            S.mark({ kind: "check", x: mid + 120, y: 1110, w: 150, h: 120, at: at + 1.0, dur: 0.35 });
        } },
        { title: "تعلّم غيرك", at: 4.0, draw: function (S, at, end, mid) {
            S.sketch({ name: "bubble", x: mid, y: 1240, size: 1.3, at: at + 0.2, dur: 0.6 });
            S.sketch({ name: "bubble", x: mid + 70, y: 1520, size: 0.8, dotted: true, tail: "right", at: at + 0.7, dur: 0.6 });
        } },
      ];
      // ------------------------------------------------------------------------------------------------------
      var K = window.Khaam, el = K.el, f1 = K.f1, n = STEPS.length;
      if (!K || !K.drawings) throw new Error("ladder-paper: load kit/kit.js and kit/paper.js in index.html");
      var tl = gsap.timeline({ paused: true });
      function MX(x) { return RAIL === "right" ? x : 1080 - x; }
      function stage(svg, seed) { return K.stage(svg, { palette: "paper", colors: COLORS, duration: DURATION, tl: tl, seed: seed, horizon: 1500, light: { x: 300, y: 700 } }); }
      var SP = stage("#lp-page", 5);
      SP.paper({ kind: PAGE, margin: true, marginX: MX(958) });
      var INK = SP.pal.ink, ACC = SP.pal.accent;
      var STRIP = MX(772), MID = MX(400);   // the margin column's inner edge; the middle of the sections' column
      // ---------- the margin ladder (fixed: pushes never scale it) ----------
      var SR = stage("#lp-railsvg", 21), railW = el("g", null, SR.L("near")), rail = el("g", null, railW);
      var RX0 = MX(852), RX1 = MX(932), RBX = MX(812), RTOP = 690, RBOT = 1392, RR = [];
      for (var i = 0; i < n; i++) RR.push(RBOT - 80 - i * (RBOT - 80 - RTOP - 20) / Math.max(1, n - 1));
      SR.ink({ d: K.handPoly(SR, [[STRIP, -40], [STRIP + 1, 900], [STRIP, 1960]], 2), still: true, pencil: true, width: 2.2, parent: SR.L("near") });
      [RX0, RX1].forEach(function (x, k) { SR.ink({ d: K.handPoly(SR, [[x, RBOT], [x, RTOP]], 1.5), still: true, width: 4.5, parent: rail }); });
      var badges = RR.map(function (y, k) {
        SR.ink({ d: K.handPoly(SR, [[RX0, y], [RX1, y]], 1.5), still: true, width: 4.5, parent: rail });
        var bg = el("g", null, rail), fill = el("circle", { cx: RBX, cy: f1(y), r: 25 }, bg);
        SR.paint(fill, "fill", { role: "accent", mix: "paper", k: 0.45 }); fill.style.opacity = 0;
        SR.ink({ d: K.handLine(SR, (function () { var p = []; for (var a = 0; a <= 16; a++) { var t = -Math.PI / 2 + a / 16 * Math.PI * 2.05; p.push([RBX + Math.cos(t) * 25, y + Math.sin(t) * 25]); } return p; })(), 1.2), still: true, width: 3, parent: bg });
        var num = el("text", { x: RBX, y: f1(y + 2), "text-anchor": "middle", "dominant-baseline": "central", "font-family": "Display", "font-size": 30, "font-weight": 700 }, bg);
        num.textContent = String(k + 1); SR.paint(num, "fill", "ink");
        var lit = el("path", { d: K.poly([[RX0 - 6, y - 9], [RX1 + 6, y - 9], [RX1 + 6, y + 9], [RX0 - 6, y + 9]], true) }, rail);
        SR.paint(lit, "fill", "accent"); lit.style.opacity = 0; lit.style.mixBlendMode = "multiply";
        return { g: bg, fill: fill, num: num, lit: lit, y: y };
      });
      // the top rung keeps its «؟» until its own step
      var q = document.createElement("div"); q.className = "lp-q"; q.dir = "rtl"; q.textContent = "؟"; q.style.color = K.shade(ACC, -0.22);   // the accent, a little darker: 3:1 on the page
      q.style.left = (RBX - 13) + "px"; q.style.top = (RR[n - 1] - 26) + "px";
      document.getElementById("lp-rail").appendChild(q);
      badges[n - 1].num.style.opacity = 0;
      gsap.set("#lp-rail", { x: RAIL === "right" ? 330 : -330 }); tl.set("#lp-rail", { x: RAIL === "right" ? 330 : -330 }, 0);
      var tRail = Math.max(0, T(STEPS[0].at) - 0.1);
      if (tRail <= 0.05) { gsap.set("#lp-rail", { x: 0 }); tl.set("#lp-rail", { x: 0 }, 0); }
      else tl.fromTo("#lp-rail", { x: RAIL === "right" ? 330 : -330 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, tRail);

      /** rung(i, at): the rung lights (a wash wiped in), its badge fills and pulses; the one before steps back */
      function rung(i, at) {
        var b = badges[i];
        tl.fromTo(b.lit, { opacity: 0 }, { opacity: 0.85, duration: 0.35, ease: "power1.out", immediateRender: false }, at);
        tl.fromTo(b.fill, { opacity: 0 }, { opacity: 0.95, duration: 0.3, ease: "power1.out", immediateRender: false }, at + 0.1);
        SR.svgMove(b.g, at, 0.16, { s: 1 }, { s: 1.25 }, "power1.out", [RBX, b.y]);
        SR.svgMove(b.g, at + 0.16, 0.18, { s: 1.25 }, { s: 1 }, "power1.in", [RBX, b.y]);
        if (i === n - 1) { tl.to(q, { opacity: 0, duration: 0.2 }, at); tl.to(b.num, { opacity: 1, duration: 0.25 }, at + 0.15); }
        if (i > 0) { tl.to(badges[i - 1].lit, { opacity: 0.45, duration: 0.3 }, at); tl.to(badges[i - 1].fill, { opacity: 0.45, duration: 0.3 }, at); }
      }
      /** section(i, {in, out}): its own layer slides in from the left (a breath of blur) and out to the right */
      var secs = STEPS.map(function (st, k) {
        var d = document.createElement("div"); d.className = "lp-layer"; d.setAttribute("data-layout-allow-overflow", "");
        d.style.visibility = "hidden";
        var s = document.createElementNS(K.NS, "svg"); d.appendChild(s);
        document.getElementById("lp-secs").appendChild(d);
        var h = document.createElement("div"); h.className = "lp-head"; h.dir = "rtl"; h.style.color = INK;
        h.style.top = HEAD_Y + "px"; h.style.right = (RAIL === "right" ? 1080 - STRIP + 40 : 40) + "px";
        var nb = document.createElement("div"); nb.className = "lp-num"; nb.textContent = String(k + 1); h.appendChild(nb);
        var tx = document.createElement("div");
        var tt = document.createElement("div"); tt.className = "lp-title"; tt.textContent = st.title; tx.appendChild(tt);
        if (st.note) { var nt = document.createElement("div"); nt.className = "lp-note"; nt.dir = "rtl"; nt.textContent = st.note; tx.appendChild(nt); }
        h.appendChild(tx); d.appendChild(h);
        return { div: d, svg: s, head: h, title: tt };
      });
      function section(i, o) {
        var d = secs[i].div, tIn = o["in"], tOut = o.out;
        if (tIn <= 0.05) { gsap.set(d, { visibility: "visible", x: 0 }); tl.set(d, { visibility: "visible", x: 0 }, 0); }
        else {
          tl.set(d, { visibility: "visible" }, tIn - 0.01);
          tl.fromTo(d, { x: -1180, filter: "blur(6px)" }, { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false }, tIn);
          tl.set(d, { filter: "none" }, tIn + 0.46);
        }
        // the title is written in from the right (a whole line, never letter by letter)
        var from = "inset(-40px 0px -40px 100%)", tt = secs[i].title;
        if (tIn > 0.05) { gsap.set(tt, { clipPath: from }); tl.fromTo(tt, { clipPath: from }, { clipPath: "inset(-40px 0px -40px 0%)", duration: 0.5, ease: "power1.inOut", immediateRender: false }, tIn + 0.2); }
        if (tOut !== null && tOut !== undefined) {
          tl.fromTo(d, { x: 0, filter: "blur(0px)" }, { x: 1180, filter: "blur(6px)", duration: 0.4, ease: "power3.in", immediateRender: false }, tOut);
          tl.set(d, { visibility: "hidden" }, tOut + 0.42);
        }
      }
      /** summary(at): the sections leave; the margin ladder grows into the middle of the page, every rung named */
      function summary(at) {
        var mid = [(RX0 + RX1) / 2, (RTOP + RBOT) / 2], sc = 1.3;
        SR.svgMove(railW, at, 0.7, { x: 0, y: 0, s: 1 }, { x: MID - mid[0], y: 40, s: 1 }, "power3.inOut", mid);
        SR.svgMove(rail, at, 0.7, { s: 1 }, { s: sc }, "power3.inOut", mid);
        badges.forEach(function (b, k) {
          var lab = document.createElement("div"); lab.className = "lp-lab"; lab.dir = "rtl"; lab.textContent = STEPS[k].title; lab.style.color = INK;
          var ry = mid[1] + 40 + (b.y - mid[1]) * sc;
          lab.style.top = (ry - 32) + "px";   // beside its rung, on the side away from the numbers
          if (RAIL === "right") lab.style.left = (MID + 80) + "px"; else lab.style.right = (1080 - (MID - 80)) + "px";
          document.getElementById("lp-rail").appendChild(lab);
          tl.fromTo(lab, { opacity: 0, x: RAIL === "right" ? -30 : 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at + 0.5 + k * 0.08);
          tl.to(b.lit, { opacity: 0.85, duration: 0.3 }, at + 0.5 + k * 0.08); tl.to(b.fill, { opacity: 0.95, duration: 0.3 }, at + 0.5 + k * 0.08);
        });
      }

      // ---------- build: each step's section, its rung, its push ----------
      var tSum = SUMMARY === null || SUMMARY === undefined ? null : T(SUMMARY);
      STEPS.forEach(function (st, k) {
        var tIn = T(st.at), next = k + 1 < n ? T(STEPS[k + 1].at) : null;
        var tOut = next !== null ? Math.max(tIn + 0.5, next - 0.42) : (tSum !== null ? tSum - 0.05 : null);
        var end = tOut === null ? DURATION : tOut;
        var S = stage(secs[k].svg, 31 + k * 10);
        st.draw(S, tIn, end, MID);
        var span = Math.max(0.5, end - tIn + 0.45), to = Math.min(1.15, 1 + 0.03 * span);   // ≈ 3 %/s: it reads as motion
        S.push({ from: 1, to: to, at: tIn, dur: span, origin: [MID, 1200], ease: "sine.inOut" });
        section(k, { "in": tIn, out: tOut });
        rung(k, tIn + 0.25);
      });
      if (tSum !== null) summary(tSum);
      stage("#lp-film", 9).film({ grain: 0.06, vignette: 0.18 });
      window.__timelines["ladder-paper"] = tl;
    })();
  </script>
</template>
