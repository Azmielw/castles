<template>
  <!--
    End card (Khaam Motion 1.7): a calm last screen, 2-3.5 s. The page's mark glows (the user's logo from
    assets/logo.png, or a code-drawn light when there is none), the page name and handle, one follow or share
    line, and an optional comment keyword. Arabic first; a second language line is optional.
    Keep everything between y≈250 and y≈1540 (the bottom sits under the app's buttons).
  -->
  <style>
    @font-face { font-family: "Display"; src: url("assets/fonts/display.ttf"); font-weight: 100 900; }
    @font-face { font-family: "Second"; src: url("assets/fonts/text.ttf"); font-weight: 100 900; }
    #ec-root { position: absolute; inset: 0; pointer-events: none; }
    #ec-bg { position: absolute; inset: 0; background: var(--bg, #0b1224); opacity: 0; }
    #ec-box { position: absolute; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; opacity: 0; }
    #ec-mark { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
    #ec-glow { position: absolute; left: -90px; top: -90px; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(242,196,109,0.5) 0%, rgba(242,196,109,0.12) 40%, rgba(242,196,109,0) 70%); }
    #ec-logo { position: relative; width: 160px; height: 160px; object-fit: contain; }
    #ec-name { font-family: "Display", serif; font-weight: 700; font-size: 64px; line-height: 1.3; color: var(--ink, #f4eee3); }
    #ec-handle { font-family: "Second", sans-serif; font-weight: 600; font-size: 34px; color: var(--accent, #f2c46d); }
    .ec-line { font-family: "Display", serif; font-weight: 500; font-size: 44px; line-height: 1.5; color: var(--ink, #f4eee3); text-align: center; width: 900px; }
    .ec-second { font-family: "Second", serif; font-weight: 500; font-size: 32px; color: var(--ink, #f4eee3); opacity: 0.8; text-align: center; }
    #ec-key { margin-top: 10px; padding: 14px 34px; border-radius: 18px; background: var(--accent, #f2c46d);
      font-family: "Display", serif; font-weight: 700; font-size: 46px; color: #14100a; }
  </style>
  <div id="ec-root" data-composition-id="end-card" data-width="1080" data-height="1920">
    <div id="ec-bg"></div>
    <div id="ec-box">
      <div id="ec-mark">
        <div id="ec-glow" data-layout-allow-overflow></div>
        <svg id="ec-drawn" width="120" height="150" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" style="position:relative">
          <path d="M60 6 C60 6 12 66 12 98 a48 48 0 0 0 96 0 C108 66 60 6 60 6Z" fill="#f2c46d" opacity="0.92"/>
          <path d="M60 58 C60 58 38 88 38 104 a22 22 0 0 0 44 0 C82 88 60 58 60 58Z" fill="#fff6dc" opacity="0.85"/>
        </svg>
      </div>
      <div id="ec-name" dir="rtl"></div>
      <div id="ec-handle" dir="ltr"></div>
      <div class="ec-line" id="ec-line" dir="rtl"></div>
      <div class="ec-second" id="ec-second" dir="ltr"></div>
      <div id="ec-key" dir="rtl"></div>
    </div>
  </div>
  <script>
    (function () {
      // ---- edit here ---------------------------------------------------------------------------------------
      var END = {
        name: "اسم صفحتك",
        handle: "@yourpage",
        line: "تابعنا لفكرة صغيرة كل يوم",   // or a share line: «أرسلها لأحد يحتاجها»
        second: "",                          // optional second language
        keyword: "",                         // optional: «اكتب "ضوء" في التعليقات»
        logo: "",                            // e.g. "assets/logo.png"; empty = the drawn light
      };
      var AT = 0.0, HOLD = 3.0;   // start (seconds, or a cue name) and length
      var TOP = 640;
      // ------------------------------------------------------------------------------------------------------
      var at = typeof AT === "number" ? AT : window.cue(AT);
      var box = document.getElementById("ec-box"); box.style.top = TOP + "px";
      document.getElementById("ec-name").textContent = END.name;
      document.getElementById("ec-handle").textContent = END.handle;
      document.getElementById("ec-line").textContent = END.line;
      if (END.second) document.getElementById("ec-second").textContent = END.second; else document.getElementById("ec-second").remove();
      if (END.keyword) document.getElementById("ec-key").textContent = END.keyword; else document.getElementById("ec-key").remove();
      if (!END.handle) document.getElementById("ec-handle").remove();
      if (END.logo) {
        var img = document.createElement("img"); img.id = "ec-logo"; img.src = END.logo; img.alt = "";
        document.getElementById("ec-drawn").replaceWith(img);
      }
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#ec-bg", { opacity: 0 }, { opacity: 0.85, duration: 0.5, ease: "power1.inOut" }, at);
      tl.fromTo(box, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, at + 0.15);
      tl.fromTo("#ec-glow", { scale: 0.85, opacity: 0.5 }, { scale: 1.1, opacity: 1, duration: HOLD * 0.6, ease: "sine.inOut" }, at + 0.2);
      tl.to("#ec-glow", { scale: 1.0, opacity: 0.8, duration: HOLD * 0.4, ease: "sine.inOut" }, at + 0.2 + HOLD * 0.6);
      tl.to(box, { opacity: 0, duration: 0.4, ease: "power1.in" }, at + HOLD - 0.4);
      window.__timelines["end-card"] = tl;
    })();
  </script>
</template>
