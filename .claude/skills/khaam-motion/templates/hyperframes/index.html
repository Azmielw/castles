<!doctype html>
<!--
  khaam-motion HyperFrames starter (Arabic, 9:16, 8 s). Copy this folder into the video's folder, then:
  fonts → assets/fonts/display.ttf and text.ttf (the same file when there is no second language), words → timing.js (scripts/cues.py), look → the :root variables (<skill>/reference/hyperframes.md).
  Arabic rules: dir="rtl" on every row of separate words, never on <html>; whole words only, never letter splits.
-->
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- The narration's word times and cue("<spoken word>"): made by scripts/cues.py build -->
    <script src="timing.js"></script>
    <!-- Drawn worlds and faceless people (reference/scene-kit.md, figure-kit.md): uncomment what the video uses.
    <script src="kit/kit.js"></script>
    <script src="kit/scene.js"></script>
    <script src="kit/figure.js"></script>
    <script src="kit/paper.js"></script>
    -->
    <style>
      :root {
        --bg: #111317;      /* background */
        --ink: #f5f2ec;     /* text */
        --accent: #ff5a36;  /* one accent colour */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30"
         data-width="1080" data-height="1920">
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
           data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="8" data-track-index="2" data-track-kind="captions"
           data-width="1080" data-height="1920"></div>
      <!-- Text and story blocks (reference/hyperframes.md step 6, reference/story-formats.md). Times inside each
           block are seconds of the whole video, so give each one data-start="0" and the video's full length.
      <div id="word-lit" data-composition-id="word-lit" data-composition-src="compositions/word-lit.html"
           data-start="0" data-duration="8" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="verified-card" data-composition-id="verified-card" data-composition-src="compositions/verified-card.html"
           data-start="0" data-duration="8" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="ladder" data-composition-id="ladder" data-composition-src="compositions/ladder.html"
           data-start="0" data-duration="8" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="compare" data-composition-id="compare" data-composition-src="compositions/compare.html"
           data-start="0" data-duration="8" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end-card" data-composition-id="end-card" data-composition-src="compositions/end-card.html"
           data-start="0" data-duration="8" data-track-index="7" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="rewind" data-composition-id="rewind" data-composition-src="compositions/rewind.html"
           data-start="0" data-duration="8" data-track-index="8" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      -->
      <!-- Narration or the mix, when there is one (times in seconds of the whole video):
      <audio id="vo" class="clip" src="assets/mix.wav" data-start="0" data-duration="8"
             data-track-index="9" data-volume="1"></audio>
      -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
